<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Transformation Estimator — Vandana Karthikeya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f9fc;
    --bg-gradient: linear-gradient(180deg, #ffffff 0%, #f6f9fc 100%);
    --card: #ffffff;
    --ink: #0a2540;
    --ink-2: #425466;
    --muted: #687385;
    --muted-2: #8895a7;
    --border: #e3e8ee;
    --border-soft: #eef2f7;
    --accent: #635bff;
    --accent-2: #5a52e8;
    --accent-soft: #ede9fe;
    --good: #00b86b;
    --good-soft: #d1fae5;
    --warn: #f59e0b;
    --warn-soft: #fef3c7;
    --danger: #e0394a;
    --danger-soft: #fee2e2;
    --shadow-sm: 0 1px 2px rgba(10,37,64,0.04);
    --shadow: 0 2px 8px rgba(10,37,64,0.06);
    --shadow-lg: 0 8px 32px rgba(10,37,64,0.08);
    --shadow-accent: 0 4px 12px rgba(99,91,255,0.25);
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg-gradient);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .top-bar {
    border-bottom: 1px solid var(--border-soft);
    padding: 14px 24px;
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.85);
  }
  .top-bar-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--accent); }
  .top-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .top-badge {
    font-size: 11px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .container {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .hero {
    text-align: center;
    margin-bottom: 36px;
  }
  .hero-eyebrow {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  .hero h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 10px;
    line-height: 1.2;
  }
  .hero-sub {
    font-size: 16px;
    color: var(--ink-2);
    max-width: 600px;
    margin: 0 auto;
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    padding: 10px;
    background: white;
    border-radius: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-soft);
    max-width: fit-content;
    margin-left: auto;
    margin-right: auto;
  }
  .step-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 6px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    transition: all 0.15s;
    cursor: pointer;
  }
  .step-pill:hover { color: var(--ink); }
  .step-pill.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .step-pill.done { color: var(--good); }
  .step-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #f1f5f9;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .step-pill.active .step-num { background: var(--accent); color: white; }
  .step-pill.done .step-num { background: var(--good); color: white; }
  .step-divider { width: 16px; height: 1px; background: var(--border); }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border-soft);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .card-header {
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border-soft);
  }
  .card-header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }
  .card-num {
    width: 26px; height: 26px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .card-help {
    font-size: 14px;
    color: var(--ink-2);
    margin-left: 38px;
  }
  .card-body { padding: 24px 28px; }
  .section-block { margin-bottom: 24px; }
  .section-block:last-child { margin-bottom: 0; }
  .section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-icon { font-size: 14px; }
  .section-desc {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    margin-bottom: 12px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    background: white;
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
    user-select: none;
    box-shadow: var(--shadow-sm);
  }
  .chip:hover {
    border-color: #c1c9d2;
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(10,37,64,0.08);
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-weight: 600;
    box-shadow: var(--shadow-accent);
  }
  .chip.active:hover { background: var(--accent-2); }
  .chip-small { padding: 6px 12px; font-size: 12px; }
  .slider-block { margin-bottom: 22px; }
  .slider-block:last-child { margin-bottom: 0; }
  .slider-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .slider-desc {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 3px;
    outline: none;
    margin: 8px 0;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    border: 2px solid var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(99,91,255,0.3);
    transition: transform 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    border: 2px solid var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(99,91,255,0.3);
  }
  .slider-scale {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted-2);
    margin-top: 4px;
  }
  .slider-hint {
    margin-top: 8px;
    padding: 8px 12px;
    background: var(--accent-soft);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }
  .input-row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .input-label {
    font-size: 13px;
    color: var(--ink-2);
    font-weight: 500;
  }
  input[type="number"], input[type="text"] {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    color: var(--ink);
    font-family: inherit;
    width: 140px;
    transition: border-color 0.15s;
  }
  input[type="number"]:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .input-suffix {
    font-size: 13px;
    color: var(--muted);
  }
  .result-card {
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }
  .result-header {
    padding: 20px 28px;
    background: linear-gradient(135deg, #635bff 0%, #4a44d6 100%);
    color: white;
  }
  .result-header-eyebrow {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    opacity: 0.85;
    margin-bottom: 4px;
  }
  .result-header-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .result-body { padding: 28px; background: white; }
  .result-metrics {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    gap: 0;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .metric {
    padding: 20px 18px;
    background: white;
    border-right: 1px solid var(--border-soft);
  }
  .metric:last-child { border-right: none; }
  .metric.highlighted {
    background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
    border: none;
  }
  .metric-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .metric.highlighted .metric-label { color: var(--accent); }
  .metric-value {
    font-size: 26px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .metric.highlighted .metric-value { color: var(--accent); font-size: 30px; }
  .metric-sub {
    font-size: 12px;
    color: var(--muted-2);
    margin-top: 3px;
  }
  .grade-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding: 12px 16px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    flex-wrap: wrap;
  }
  .grade-badge {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .grade-A { background: var(--good-soft); color: #006b40; }
  .grade-B { background: var(--accent-soft); color: var(--accent); }
  .grade-C { background: var(--warn-soft); color: #7c5300; }
  .grade-D { background: var(--danger-soft); color: #9b1c2b; }
  .grade-text {
    font-size: 13px;
    color: var(--ink-2);
    flex: 1;
  }
  .range-text {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .why-line {
    font-size: 13px;
    color: var(--ink-2);
    padding: 12px 16px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    border-left: 3px solid var(--accent);
  }
  .benchmark-verdict {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .benchmark-verdict.aligned { color: var(--good); }
  .benchmark-verdict.under { color: var(--warn); }
  .benchmark-verdict.over { color: var(--danger); }
  .benchmark-data {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-top: 12px;
  }
  .bench-item {
    text-align: center;
    padding: 10px;
    background: var(--bg);
    border-radius: 6px;
  }
  .bench-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .bench-value { font-size: 15px; font-weight: 700; color: var(--ink); margin-top: 2px; font-variant-numeric: tabular-nums; }
  details {
    margin-top: 16px;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
  }
  details summary {
    cursor: pointer;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    user-select: none;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before {
    content: '▸';
    transition: transform 0.15s;
    color: var(--muted);
  }
  details[open] summary::before { transform: rotate(90deg); }
  details summary:hover { color: var(--accent-2); }
  details .details-content {
    padding: 0 16px 16px;
    color: var(--ink-2);
    font-size: 13px;
  }

  /* ============ SCOPE SELECTOR ============ */
  .scope-section {
    margin-bottom: 16px;
    padding: 16px 20px;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
  }
  .scope-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .scope-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .scope-sources {
    font-size: 11px;
    color: var(--muted-2);
    cursor: help;
  }
  .scope-options {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .scope-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: white;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
  }
  .scope-option:hover {
    border-color: var(--accent);
    background: #fafbff;
  }
  .scope-option.checked {
    border-color: var(--accent);
    background: #fafbff;
  }
  .scope-checkbox {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-radius: 4px;
    background: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .scope-option.checked .scope-checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }
  .scope-option.checked .scope-checkbox::after {
    content: '✓';
    color: white;
    font-size: 12px;
    font-weight: 700;
  }
  .scope-info {
    flex: 1;
    min-width: 0;
  }
  .scope-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .scope-desc {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .scope-amount {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .scope-amount.dim {
    color: var(--muted-2);
    font-weight: 500;
  }
  .scope-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    margin-top: 12px;
    background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
    border-radius: var(--radius-sm);
  }
  .scope-total-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .scope-total-amount {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .scope-presets {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .scope-preset {
    padding: 4px 10px;
    border-radius: 12px;
    background: white;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--ink-2);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
  }
  .scope-preset:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .math-block {
    font-family: 'SF Mono', Monaco, ui-monospace, monospace;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 11px;
    color: var(--ink-2);
    white-space: pre-wrap;
    line-height: 1.6;
    overflow-x: auto;
    margin-top: 8px;
  }
  .wave-item {
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin: 10px 0;
  }
  .wave-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .wave-title { font-weight: 600; font-size: 14px; color: var(--ink); }
  .wave-cost { color: var(--accent); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .wave-items { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
  .wave-kill { font-size: 11px; color: var(--muted); margin-top: 6px; font-style: italic; }
  .nav-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 24px;
  }
  .btn {
    padding: 11px 22px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: linear-gradient(180deg, #635bff 0%, #5a52e8 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(99,91,255,0.25);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(99,91,255,0.35);
  }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .btn-secondary {
    background: white;
    color: var(--ink-2);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    border-color: #c1c9d2;
    color: var(--ink);
  }
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
  }
  .empty-state-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state-text { font-size: 14px; }
  .count-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: white;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    margin-left: 6px;
    min-width: 20px;
  }
  .pricing-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
  }
  .pricing-card {
    padding: 14px 16px;
    background: white;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
  }
  .pricing-name { font-weight: 700; font-size: 13px; color: var(--ink); margin-bottom: 4px; }
  .pricing-fit { font-size: 12px; font-weight: 600; }
  .pricing-fit.recommended { color: var(--good); }
  .pricing-fit.acceptable { color: var(--ink-2); }
  .pricing-fit.caution { color: var(--warn); }
  .pricing-fit.not { color: var(--danger); }
  .pricing-note { font-size: 11px; color: var(--muted); margin-top: 4px; }
  @media (max-width: 720px) {
    .container { padding: 20px 16px 60px; }
    .hero h1 { font-size: 24px; }
    .hero-sub { font-size: 14px; }

function setState(patch) {
  if (typeof patch === 'function') patch = patch(state);
  state = Object.assign({}, state, patch);
  render();

function sliderMult(value, minVal, maxVal) { const t = (value - 1) / 4; return minVal + t * (maxVal - minVal); }

function selectedWorkflowsArr() {
  const arr = [];
  for (const id in state.workflows) if (state.workflows[id] && state.workflows[id].selected) arr.push(state.workflows[id]);
  return arr;
}

function computeBuildEstimate() {
  const selected = selectedWorkflowsArr();
  if (selected.length === 0) return { empty: true, p10: 0, p50: 0, p90: 0, grade: 'D', workflowBreakdown: [], pillars: {}, math: '', benchmark: null };

  const delivery = DELIVERY_MODELS.find(d => d.id === state.delivery) || DELIVERY_MODELS[0];
  const vintage = VINTAGES.find(v => v.id === state.vintage) || VINTAGES[1];
  const foundationPreset = FOUNDATION_PRESETS.find(f => f.id === state.foundation) || FOUNDATION_PRESETS[1];

  const rate = state.rateOverride !== null ? state.rateOverride : delivery.defaultRate;

  const dataMult = sliderMult(state.sliders.data_readiness, 1.25, 0.90);
  const matMult = sliderMult(state.sliders.ai_maturity, 1.20, 0.95);
  const regMult = sliderMult(state.sliders.regulatory, 0.95, 1.30);

  let tightAdjust = 1.0;
  if (state.tighten.team_exists === 'no') tightAdjust *= 1.08;
  if (state.tighten.team_exists === 'partial') tightAdjust *= 1.02;
  if (state.tighten.mlops_in_place === 'yes') tightAdjust *= 0.94;
  if (state.tighten.mlops_in_place === 'no') tightAdjust *= 1.06;
  if (state.tighten.data_platform === 'modern') tightAdjust *= 0.95;
  if (state.tighten.data_platform === 'legacy') tightAdjust *= 1.10;
  if (state.tighten.buy_first === 'yes') tightAdjust *= 0.65;

  let workflowCost = 0;
  let totalBaseHours = 0;
  const breakdown = [];
  let benchmarkLow = 0, benchmarkMed = 0, benchmarkHigh = 0;

  for (const w of selected) {
    const adjustedHours = w.hours * vintage.mult * delivery.baseAdjust;
    totalBaseHours += w.hours * vintage.mult;
    const cost = adjustedHours * rate * dataMult;
    workflowCost += cost;
    breakdown.push({ id: w.id, name: w.name, hours: w.hours, value: w.value, tokenWeight: w.tokenWeight, cost, adjustedHours, benchmark: w.benchmark });
    if (w.benchmark) {
      benchmarkLow += w.benchmark.low;
      benchmarkMed += w.benchmark.median;
      benchmarkHigh += w.benchmark.high;
    }
  }

  const N = selected.length;
  const foundationScale = N === 0 ? 0 : 1.0 + (N - 1) * 0.15;
  const foundations = workflowCost * foundationPreset.ratio * foundationScale * regMult * matMult;

  const subtotal = (workflowCost + foundations) * tightAdjust;
  const contingency = subtotal * 0.10;
  const total = subtotal + contingency;

  let tightCount = 0; for (const k in state.tighten) if (state.tighten[k]) tightCount++;
  let grade, range;
  if (tightCount >= 4) { grade = 'B'; range = 0.4; }
  else if (tightCount >= 2) { grade = 'C'; range = 0.7; }
  else { grade = 'C-'; range = 1.0; }

  const p50 = total;
  const p10 = total / (1 + range);
  const p90 = total * (1 + range);

  const pillars = { workflows: workflowCost, foundations, contingency };

  const mathStr =
'BUILD COST (one-time)\n' +
'Selected: ' + N + ' workflow' + (N>1?'s':'') + '\n' +
'  Catalog hours: ' + selected.reduce((a, b) => a + b.hours, 0).toLocaleString() + ' (raw)\n' +
'  × Vintage [' + vintage.name + ']: ×' + vintage.mult + '\n' +
'  × Delivery baseAdjust: ×' + delivery.baseAdjust + '\n' +
'  = ' + Math.round(totalBaseHours * delivery.baseAdjust).toLocaleString() + ' effective hours\n' +
'Rate: $' + rate + '/hr\n\n' +
'Multipliers:\n' +
'  Data readiness:  ×' + dataMult.toFixed(2) + '\n' +
'  AI maturity:     ×' + matMult.toFixed(2) + '\n' +
'  Regulatory:      ×' + regMult.toFixed(2) + '\n\n' +
'Workflow cost   = $' + Math.round(workflowCost).toLocaleString() + '\n' +
'Foundations     = $' + Math.round(foundations).toLocaleString() + ' (' + foundationPreset.name + ', ratio ' + foundationPreset.ratio + ')\n' +
'Tightening adj  = ×' + tightAdjust.toFixed(2) + '\n' +
'+ Contingency   = ×1.10 (10%)\n\n' +
'BUILD TOTAL (P50) = $' + Math.round(total).toLocaleString() + '\n' +
'Range ±' + (range*100).toFixed(0) + '%  →  P10: $' + Math.round(p10).toLocaleString() + ', P90: $' + Math.round(p90).toLocaleString() + '\n' +
'Grade: ' + grade;

  const whyParts = [N + ' workflow' + (N>1?'s':''), vintage.name.toLowerCase()];
  if (dataMult > 1.05) whyParts.push('messy data');
  if (dataMult < 0.95) whyParts.push('clean data');
  if (regMult > 1.10) whyParts.push('heavy regulatory load');
  if (matMult > 1.10) whyParts.push('early AI maturity');
  if (matMult < 1.0) whyParts.push('mature AI org');
  if (foundationPreset.id === 'greenfield') whyParts.push('greenfield foundations');
  if (foundationPreset.id === 'mature') whyParts.push('mature infra');
  whyParts.push(delivery.name.toLowerCase() + ' at $' + rate + '/hr');

  let benchmark = null;
  if (benchmarkMed > 0) {
    benchmark = { low: benchmarkLow, median: benchmarkMed, high: benchmarkHigh };
  }

  return {
    empty: false, p10, p50, p90, grade,
    workflowBreakdown: breakdown, pillars, math: mathStr,
    why: whyParts.join(' · '), delivery, rate, vintage, foundationPreset,
    multipliers: { dataMult, matMult, regMult, tightAdjust },
    N, range, benchmark
  };
}

function computeOpEx(buildEst) {
  if (buildEst.empty) return { empty: true, inference: 0, cloud: 0, license: 0, support: 0, annualTotal: 0, math: '' };

  const cloud = CLOUD_OPTIONS.find(c => c.id === state.cloud) || CLOUD_OPTIONS[0];
  const inference = INFERENCE_OPTIONS.find(i => i.id === state.inference) || INFERENCE_OPTIONS[0];
  const volume = VOLUME_OPTIONS.find(v => v.id === state.volume) || VOLUME_OPTIONS[1];
  const license = LICENSE_TIERS.find(l => l.id === state.license) || LICENSE_TIERS[1];

  let inferenceAnnual = 0;
  for (const w of buildEst.workflowBreakdown) {
    const tw = TOKEN_WEIGHT_MAP[w.tokenWeight || 'med'];
    const annualCost = volume.monthly * 12 * tw.tokensPerCall * (tw.costPer1K / 1000) * inference.factor;
    inferenceAnnual += annualCost;
  }

  let cloudAnnual;
  if (state.cloudSpendOverride !== null && state.cloudSpendOverride > 0) {
    cloudAnnual = state.cloudSpendOverride * 12;
  } else {
    cloudAnnual = 3000 * buildEst.N * 12 * cloud.factor;
  }

  const licenseAnnual = license.annual;
  const supportAnnual = buildEst.p50 * (state.supportPct / 100);
  const annualTotal = inferenceAnnual + cloudAnnual + licenseAnnual + supportAnnual;

  const math =
'ANNUAL OPEX (recurring)\n' +
'Inference / LLM:  $' + Math.round(inferenceAnnual).toLocaleString() + '/yr\n' +
'  (volume: ' + volume.name + ' × ' + inference.name + ')\n\n' +
'Cloud infra:     $' + Math.round(cloudAnnual).toLocaleString() + '/yr\n' +
'  (' + cloud.name + ', $' + Math.round(cloudAnnual/12).toLocaleString() + '/mo)\n\n' +
'Licenses:        $' + licenseAnnual.toLocaleString() + '/yr  (' + license.name + ')\n\n' +
'Support (' + state.supportPct + '%): $' + Math.round(supportAnnual).toLocaleString() + '/yr\n\n' +
'ANNUAL OPEX: $' + Math.round(annualTotal).toLocaleString() + '/yr';

  return { empty: false, inference: inferenceAnnual, cloud: cloudAnnual, license: licenseAnnual, support: supportAnnual, annualTotal, math };
}

function compute3YrTCO(buildEst, opex) {
  if (buildEst.empty) return 0;
  return buildEst.p50 + (opex.annualTotal * 0.5) + (opex.annualTotal * 2);
}

// Compute the user-selected scope total based on phase checkboxes
function computeScopedTotal(buildEst, opex) {
  if (buildEst.empty) return { total: 0, lines: [] };
  const lines = [];
  const build = buildEst.p50;

  if (state.scope.discovery) {
    lines.push({
      id: 'discovery',
      name: 'Discovery & Assessment',
      desc: 'Feasibility, data audit, architecture, scoped pilot plan',
      amount: build * PHASE_PCTS.discovery,
      type: 'one-time'
    });
  }
  if (state.scope.pilot) {
    lines.push({
      id: 'pilot',
      name: 'Pilot / Proof of Concept',
      desc: 'One workflow end-to-end with real data, success criteria validated',
      amount: build * PHASE_PCTS.pilot,
      type: 'one-time'
    });
  }
  if (state.scope.build) {
    lines.push({
      id: 'build',
      name: 'Full Build',
      desc: buildEst.N + ' workflow' + (buildEst.N>1?'s':'') + ' + foundations',
      amount: build,
      type: 'one-time'
    });
  }
  if (state.scope.hosting_y1) {
    // Hosting = inference + cloud (no license, no support — those are separate)
    const hosting = (opex.inference + opex.cloud) * 0.5; // Y1 ramped at 50%
    lines.push({
      id: 'hosting_y1',
      name: 'Year 1 Hosting & Inference',
      desc: 'Cloud + LLM API costs (ramped at 50% for partial-year)',
      amount: hosting,
      type: 'year-1'
    });
  }
  if (state.scope.maintenance_y1) {
    // Maintenance = support % of build + license
    const maint = opex.support + opex.license;
    lines.push({
      id: 'maintenance_y1',
      name: 'Year 1 Maintenance & Licenses',
      desc: state.supportPct + '% support + tooling licenses',
      amount: maint,
      type: 'year-1'
    });
  }
  if (state.scope.run_y2_y3) {
    // Years 2-3 = full annual OpEx × 2
    lines.push({
      id: 'run_y2_y3',
      name: 'Years 2-3 Managed Operations',
      desc: 'Full annual OpEx × 2 years (hosting + maint + licenses)',
      amount: opex.annualTotal * 2,
      type: 'years-2-3'
    });
  }

  const total = lines.reduce((s, l) => s + l.amount, 0);
  return { total, lines };
}

function computeWaves(est) {
  if (est.empty) return [];
  const sortedByValue = est.workflowBreakdown.slice().sort((a, b) => {
    const valScore = { high: 3, med: 2, low: 1 };
    return valScore[b.value] - valScore[a.value];
  });
  const waves = [];
  if (sortedByValue.length >= 1) {
    const w1 = sortedByValue.slice(0, Math.min(2, sortedByValue.length));
    waves.push({ name: 'Wave 1 — Foundations + first workflow', items: w1, months: '0–6', kill: 'No measurable user adoption or quality gain by month 4 → stop', cost: w1.reduce((s, w) => s + w.cost, 0) + est.pillars.foundations });
  }
  if (sortedByValue.length >= 3) {
    const w2 = sortedByValue.slice(2, 4);
    waves.push({ name: 'Wave 2 — Expand to adjacent workflows', items: w2, months: '6–12', kill: 'Wave 1 metrics regress or wave 2 cost overruns >40%', cost: w2.reduce((s, w) => s + w.cost, 0) });
  }
  if (sortedByValue.length >= 5) {
    const w3 = sortedByValue.slice(4);
    waves.push({ name: 'Wave 3 — Long tail / lower-value workflows', items: w3, months: '12–18', kill: 'Lower-value workflows not delivering — drop instead of scaling', cost: w3.reduce((s, w) => s + w.cost, 0) });
  }
  return waves;
}

function fmt(n) { if (!n || n === 0) return '$0'; if (n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M'; if (n >= 1e3) return '$' + Math.round(n/1e3) + 'K'; return '$' + Math.round(n).toLocaleString(); }
function fmtRange(p10, p90) { return fmt(p10) + ' – ' + fmt(p90); }

let lastRenderedStep = -1;
function render() {
  renderStepper();
  const app = document.getElementById('app');
  app.innerHTML = '';
  const step = state.step;
  if (step === 0) app.appendChild(renderStep1());
  else if (step === 1) app.appendChild(renderStep2());
  else if (step === 2) app.appendChild(renderStep3());
  else if (step === 3) app.appendChild(renderStep4());
  else if (step === 4) app.appendChild(renderResult());
  if (step !== lastRenderedStep) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    lastRenderedStep = step;
  }
}

function renderStepper() {
  const stepper = document.getElementById('stepper');
  stepper.innerHTML = '';
  STEPS.forEach((name, i) => {
    if (i > 0) {
      const div = document.createElement('span');
      div.className = 'step-divider';
      stepper.appendChild(div);
    }
    const pill = document.createElement('div');
    pill.className = 'step-pill' + (i === state.step ? ' active' : (i < state.step ? ' done' : ''));
    pill.onclick = () => setState({ step: i });
    pill.innerHTML = '<span class="step-num">' + (i < state.step ? '✓' : (i + 1)) + '</span>' + name;
    stepper.appendChild(pill);
  });
}

function renderResult() {

  const opex = computeOpEx(est);

      '</div>' +

          '<div class="metric-value">' + fmt(est.p50) + '</div>' +

        '</div>' +

          '<div class="metric-label">3-Year TCO</div>' +
          '<div class="metric-value">' + fmt(tco3y) + '</div>' +
          '<div class="metric-sub">Build + 2.5 yr OpEx</div>' +
        '</div>' +
        '<div class="metric">' +
          '<div class="metric-label">Annual OpEx</div>' +
          '<div class="metric-value">' + fmt(opex.annualTotal) + '</div>' +
          '<div class="metric-sub">Steady state</div>' +
        '</div>' +
      '</div>' +

  const allPhases = [
    { id: 'discovery', name: 'Discovery & Assessment', desc: 'Feasibility, data audit, architecture, scoped pilot plan', amount: est.p50 * PHASE_PCTS.discovery, pctLabel: '~10% of build' },
    { id: 'pilot', name: 'Pilot / Proof of Concept', desc: 'One workflow end-to-end with real data, success criteria validated', amount: est.p50 * PHASE_PCTS.pilot, pctLabel: '~15% of build' },

    { id: 'hosting_y1', name: 'Year 1 Hosting & Inference', desc: 'Cloud + LLM API costs (ramped 50% for partial year)', amount: (opex.inference + opex.cloud) * 0.5, pctLabel: 'Yr 1 ramped' },

      setState({ scope: newScope });

  // Wire up presets
  resultCard.querySelectorAll('.scope-preset').forEach(btn => {
    btn.onclick = () => {
      const preset = btn.getAttribute('data-preset');
      let newScope;
      if (preset === 'discovery-only') newScope = { discovery: true, pilot: false, build: false, hosting_y1: false, maintenance_y1: false, run_y2_y3: false };

  const waves = computeWaves(est);
  if (waves.length > 0) {
    const waveCard = document.createElement('div');

    let waveHtml =
      '<div class="card-header">' +
        '<div class="card-header-row">' +

  const pricingCard = document.createElement('div');

  const range = est.range;
  const tightCount = Object.keys(state.tighten).length;
  let pricingHtml =
    '<div class="card-header">' +
      '<div class="card-header-row">' +
        '<div class="card-num" style="background:var(--good);">💰</div>' +
        '<div class="card-title">Pricing Model Fit</div>' +
      '</div>' +
      '<div class="card-help">Which pricing structure fits this estimate&rsquo;s uncertainty grade.</div>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="pricing-grid">';
  const pricings = [
    { name: 'Fixed Price', fit: range > 0.5 ? 'not' : 'recommended', note: range > 0.5 ? 'Too wide (±' + (range*100).toFixed(0) + '%) — you would absorb risk' : 'Tight enough to commit safely' },
    { name: 'T&M / Time-and-Materials', fit: range > 0.5 ? 'recommended' : 'acceptable', note: range > 0.5 ? 'Right structure for this uncertainty' : 'Workable but client carries more risk' },
    { name: 'Outcome-Based', fit: tightCount >= 4 ? 'recommended' : 'caution', note: tightCount >= 4 ? 'Tight enough estimate to define outcomes' : 'Need more discovery to define KPIs' },
    { name: 'Hybrid (Discovery + T&M)', fit: 'recommended', note: 'Often the best default for AI projects' }
  ];
  pricings.forEach(p => {
    pricingHtml +=
      '<div class="pricing-card">' +
        '<div class="pricing-name">' + p.name + '</div>' +
        '<div class="pricing-fit ' + p.fit + '">' + (p.fit === 'recommended' ? '✓ Recommended' : p.fit === 'acceptable' ? '~ Acceptable' : p.fit === 'caution' ? '⚠ Caution' : '✗ Not recommended') + '</div>' +
        '<div class="pricing-note">' + p.note + '</div>' +
      '</div>';
  });
  pricingHtml += '</div></div>';
  pricingCard.innerHTML = pricingHtml;
  wrap.appendChild(pricingCard);

  const mathCard = document.createElement('div');
  mathCard.className = 'card';
  mathCard.innerHTML =
    '<div class="card-body" style="padding:16px 24px;">' +
      '<details>' +
        '<summary>Show the full math</summary>' +
        '<div class="details-content">' +
          '<div class="math-block">' + est.math + '</div>' +
          '<div class="math-block">' + opex.math + '</div>' +
        '</div>' +
      '</details>' +
    '</div>';
  wrap.appendChild(mathCard);

  const nav = document.createElement('div');
  nav.className = 'nav-row';
  nav.innerHTML =
    '<button class="btn btn-secondary" onclick="setState({step:3})">← Edit TCO Inputs</button>' +
    '<button class="btn btn-primary" onclick="window.print()">🖨️ Print / Save PDF</button>';
  wrap.appendChild(nav);
  return wrap;
}

render();
</script>
</body>
</html>
