<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Estimator — v5 (Retuned + Benchmarks)</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2027;
    --panel-2: #232a33;
    --border: #2d3640;
    --text: #e8eef5;
    --text-dim: #8a96a3;
    --accent: #4a9eff;
    --accent-2: #b78aff;
    --good: #5fd4a3;
    --warn: #f5a623;
    --danger: #ef5b5b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  .container { max-width: 760px; margin: 0 auto; padding: 32px 24px 80px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 22px; margin: 0; font-weight: 600; }
  .subtitle { color: var(--text-dim); margin: 4px 0 0; font-size: 13px; }
  .dots { display: flex; gap: 6px; align-items: center; background: var(--panel); padding: 6px 10px; border-radius: 20px; font-size: 12px; color: var(--text-dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.2s; }
  .dot.active { background: var(--accent); transform: scale(1.4); }
  .dot.done { background: var(--good); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin: 16px 0; }
  .card-step { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: 600; }
  .card-title { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .card-help { color: var(--text-dim); margin-bottom: 20px; font-size: 14px; }
  .workflow-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; margin: 4px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .workflow-chip:hover { border-color: var(--accent); }
  .workflow-chip.selected { background: rgba(74, 158, 255, 0.18); border-color: var(--accent); color: var(--text); }
  .workflow-chip .check { color: var(--accent); }
  .workflow-chip .hours { color: var(--text-dim); font-size: 11px; }
  .workflow-group { margin: 16px 0; }
  .workflow-group h3 { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 12px 0 8px; }
  .slider-row { margin: 22px 0; }
  .slider-row > label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
  .slider-row .value-pill { color: var(--accent); }
  .slider-row .desc { color: var(--text-dim); font-size: 13px; margin-bottom: 10px; }
  .slider-track { position: relative; height: 36px; background: var(--panel-2); border-radius: 8px; padding: 4px; display: grid; gap: 4px; }
  .slider-track.steps-3 { grid-template-columns: repeat(3, 1fr); }
  .slider-track.steps-5 { grid-template-columns: repeat(5, 1fr); }
  .slider-step { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); cursor: pointer; font-size: 13px; transition: all 0.15s; display: flex; align-items: center; justify-content: center; padding: 0 8px; text-align: center; }
  .slider-step:hover { color: var(--text); border-color: var(--accent); }
  .slider-step.selected { background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; }
  .slider-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .slider-hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .delivery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 16px 0; }
  @media (max-width: 600px) { .delivery-grid { grid-template-columns: 1fr; } }
  .delivery-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; cursor: pointer; transition: all 0.15s; }
  .delivery-card:hover { border-color: var(--accent); }
  .delivery-card.selected { background: rgba(74, 158, 255, 0.12); border-color: var(--accent); }
  .delivery-name { font-weight: 600; font-size: 14px; }
  .delivery-rate { color: var(--accent); font-weight: 600; font-size: 13px; }
  .delivery-desc { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .rate-row { display: flex; align-items: center; gap: 12px; background: var(--panel-2); border-radius: 8px; padding: 12px; margin-top: 12px; flex-wrap: wrap; }
  .rate-row > label { font-size: 13px; color: var(--text-dim); }
  .rate-row input { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; color: var(--text); font-size: 14px; width: 90px; }
  .nav { display: flex; justify-content: space-between; margin-top: 24px; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s; }
  .btn:hover:not(:disabled) { background: #3a8eef; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn-link { background: none; color: var(--accent); border: none; cursor: pointer; font-size: 13px; padding: 8px; }
  .btn-link:hover { text-decoration: underline; }
  .tco-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 20px 0; }
  @media (max-width: 700px) { .tco-grid { grid-template-columns: 1fr; } }
  .tco-tile { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; }
  .tco-tile.highlight { background: linear-gradient(180deg, rgba(183,138,255,0.10) 0%, rgba(74,158,255,0.06) 100%); border-color: var(--accent-2); }
  .tco-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .tco-value { font-size: 30px; font-weight: 700; margin: 8px 0 2px; }
  .tco-value.build { color: var(--accent); }
  .tco-value.opex { color: var(--good); }
  .tco-value.total { color: var(--accent-2); }
  .tco-sub { font-size: 11px; color: var(--text-dim); }
  .benchmark-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 16px 0; }
  .benchmark-header { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .benchmark-bar-container { position: relative; height: 50px; margin: 12px 0; }
  .benchmark-bar { position: absolute; top: 20px; left: 0; right: 0; height: 10px; background: linear-gradient(90deg, var(--good) 0%, var(--accent) 50%, var(--warn) 100%); border-radius: 5px; opacity: 0.4; }
  .benchmark-tick { position: absolute; top: 14px; width: 2px; height: 22px; background: var(--text-dim); }
  .benchmark-tick.estimate { background: var(--accent-2); width: 4px; height: 30px; top: 10px; box-shadow: 0 0 8px var(--accent-2); }
  .benchmark-label { position: absolute; font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .benchmark-label.top { top: -4px; }
  .benchmark-label.bottom { bottom: -4px; }
  .benchmark-table { width: 100%; font-size: 12px; color: var(--text-dim); margin-top: 12px; }
  .benchmark-table td { padding: 4px 0; }
  .benchmark-table td:last-child { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .benchmark-verdict { padding: 10px 12px; border-radius: 6px; margin-top: 12px; font-size: 13px; }
  .verdict-low { background: rgba(95, 212, 163, 0.12); border-left: 3px solid var(--good); }
  .verdict-mid { background: rgba(74, 158, 255, 0.12); border-left: 3px solid var(--accent); }
  .verdict-high { background: rgba(245, 166, 35, 0.12); border-left: 3px solid var(--warn); }
  .verdict-too_high { background: rgba(239, 91, 91, 0.12); border-left: 3px solid var(--danger); }
  .result-why { background: var(--panel-2); border-left: 3px solid var(--accent); padding: 12px 14px; margin: 16px 0; font-size: 14px; border-radius: 4px; }
  .wave-list { margin: 20px 0; }
  .wave-item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin: 10px 0; }
  .wave-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
  .wave-title { font-weight: 600; font-size: 15px; }
  .wave-cost { color: var(--accent); font-weight: 600; }
  .wave-items { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .wave-kill { font-size: 12px; color: var(--text-dim); margin-top: 8px; }
  .disclosure { background: var(--panel); border: 1px dashed var(--border); border-radius: 8px; padding: 14px; margin: 20px 0; text-align: center; }
  .disclosure h4 { margin: 0 0 4px; font-size: 14px; color: var(--text); }
  .disclosure p { color: var(--text-dim); font-size: 13px; margin: 0; }
  details { margin: 8px 0; }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; padding: 6px 0; user-select: none; }

  .math { font-family: ui-monospace, "SF Mono", Monaco, monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12px; color: var(--text-dim); white-space: pre-wrap; margin: 8px 0; line-height: 1.6; overflow-x: auto; }
  .tighten-q { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin: 10px 0; }
  .tighten-q-label { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
  .tighten-q-options { display: flex; gap: 6px; flex-wrap: wrap; }
  .tighten-pill { padding: 6px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; cursor: pointer; font-size: 12px; color: var(--text-dim); }
  .tighten-pill:hover { border-color: var(--accent); }
  .tighten-pill.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .grade-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; margin-left: 6px; }
  .grade-A { background: var(--good); color: #052; }
  .grade-B { background: var(--accent); color: white; }
  .grade-C { background: var(--warn); color: #322; }
  .grade-D { background: var(--danger); color: white; }
  .warn-callout { background: rgba(245, 166, 35, 0.12); border-left: 3px solid var(--warn); padding: 10px 12px; margin: 16px 0; font-size: 13px; border-radius: 4px; }
  .price-fit-recommended { color: var(--good); font-size: 12px; font-weight: 600; }
  .price-fit-acceptable { color: var(--text-dim); font-size: 12px; font-weight: 600; }
  .price-fit-caution { color: var(--warn); font-size: 12px; font-weight: 600; }
  .price-fit-not { color: var(--danger); font-size: 12px; font-weight: 600; }
  .price-note { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  h3 { margin-top: 24px; margin-bottom: 8px; }
  .tco-section { margin: 18px 0; }
  .tco-section-label { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; }
  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill-opt { padding: 8px 14px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 18px; cursor: pointer; font-size: 13px; color: var(--text-dim); }
  .pill-opt:hover { border-color: var(--accent); }
  .pill-opt.selected { background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; }
  .helper-text { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .opex-breakdown { font-size: 13px; color: var(--text-dim); }
  .opex-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .opex-row:last-child { border-bottom: none; }
  .opex-row .label { color: var(--text); }
  .opex-row .val { font-variant-numeric: tabular-nums; }
  @media print { body { background: white; color: black; } .nav, .dots { display: none !important; } .card { border: 1px solid #ccc; } }
</style>

  foundation: 'partial',         // NEW
  rateOverride: null,
  tighten: {},
  cloud: 'aws',
  cloudSpendOverride: null,
  inference: 'public_api',
  volume: 'med',
  license: 'standard',
  supportPct: 18
};

function setState(patch) { if (typeof patch === 'function') patch = patch(state); state = Object.assign({}, state, patch); render(); }
function updatePath(path, value) {
  const keys = path.split('.'); const next = JSON.parse(JSON.stringify(state)); let cur = next;
  for (let i = 0; i < keys.length - 1; i++) { if (cur[keys[i]] === undefined) cur[keys[i]] = {}; cur = cur[keys[i]]; }
  cur[keys[keys.length - 1]] = value; state = next; render();
}

// ============ ENGINE ============

function sliderMult(value, minVal, maxVal) { const t = (value - 1) / 4; return minVal + t * (maxVal - minVal); }

function selectedWorkflowsArr() {
  const arr = [];
  for (const id in state.workflows) if (state.workflows[id] && state.workflows[id].selected) arr.push(state.workflows[id]);
  return arr;
}

function computeBuildEstimate() {
  const selected = selectedWorkflowsArr();
  if (selected.length === 0) return { empty: true, p10: 0, p50: 0, p90: 0, grade: 'D', workflowBreakdown: [], pillars: {}, math: '', benchmark: null };

  const delivery = DELIVERY_MODELS.find(d => d.id === state.delivery) || DELIVERY_MODELS[0];
  const vintage = VINTAGES.find(v => v.id === state.vintage) || VINTAGES[1];
  const foundationPreset = FOUNDATION_PRESETS.find(f => f.id === state.foundation) || FOUNDATION_PRESETS[1];

  const rate = state.rateOverride !== null ? state.rateOverride : delivery.defaultRate;

  // FIX: data readiness no longer double-counts inside foundations.
  // It applies a softer multiplier (1.25 max instead of 1.5) and is the ONLY data-multiplier.
  const dataMult = sliderMult(state.sliders.data_readiness, 1.25, 0.90);
  const matMult = sliderMult(state.sliders.ai_maturity, 1.20, 0.95);
  const regMult = sliderMult(state.sliders.regulatory, 0.95, 1.30);

  let tightAdjust = 1.0;
  if (state.tighten.team_exists === 'no') tightAdjust *= 1.08;
  if (state.tighten.team_exists === 'partial') tightAdjust *= 1.02;
  if (state.tighten.mlops_in_place === 'yes') tightAdjust *= 0.94;
  if (state.tighten.mlops_in_place === 'no') tightAdjust *= 1.06;
  if (state.tighten.data_platform === 'modern') tightAdjust *= 0.95;
  if (state.tighten.data_platform === 'legacy') tightAdjust *= 1.10;
  if (state.tighten.buy_first === 'yes') tightAdjust *= 0.65;

  let workflowCost = 0;
  let totalBaseHours = 0;
  const breakdown = [];
  let benchmarkLow = 0, benchmarkMed = 0, benchmarkHigh = 0;

  for (const w of selected) {
    // Apply vintage to base hours BEFORE multipliers
    const adjustedHours = w.hours * vintage.mult * delivery.baseAdjust;
    totalBaseHours += w.hours * vintage.mult;
    const cost = adjustedHours * rate * dataMult;
    workflowCost += cost;
    breakdown.push({ id: w.id, name: w.name, hours: w.hours, value: w.value, tokenWeight: w.tokenWeight, cost, adjustedHours, benchmark: w.benchmark });
    if (w.benchmark) {
      benchmarkLow += w.benchmark.low;
      benchmarkMed += w.benchmark.median;
      benchmarkHigh += w.benchmark.high;
    }
  }

  // FIX: Foundation ratio now from preset, not auto-scaling formula
  // Foundations still scale with workflow count (sub-linear) but anchored to preset
  const N = selected.length;
  // For >1 workflow, foundations are shared. Apply a mild N-decay.
  const foundationScale = N === 0 ? 0 : 1.0 + (N - 1) * 0.15; // 1 wf = 1.0x, 3 wf = 1.3x, 5 wf = 1.6x
  const foundations = workflowCost * foundationPreset.ratio * foundationScale * regMult * matMult;

  const subtotal = (workflowCost + foundations) * tightAdjust;
  const contingency = subtotal * 0.10; // reduced from 12 to 10
  const total = subtotal + contingency;

  let tightCount = 0; for (const k in state.tighten) if (state.tighten[k]) tightCount++;
  let grade, range;
  if (tightCount >= 4) { grade = 'B'; range = 0.4; }
  else if (tightCount >= 2) { grade = 'C'; range = 0.7; }
  else { grade = 'C-'; range = 1.0; }

  const p50 = total;
  const p10 = total / (1 + range);
  const p90 = total * (1 + range);

  const pillars = { workflows: workflowCost, foundations, contingency };

  const mathStr =
`BUILD COST (one-time)
Selected: ${N} workflow${N>1?'s':''}
  Catalog hours: ${selected.reduce((a, b) => a + b.hours, 0).toLocaleString()} (raw)
  × Vintage [${vintage.name}]: ×${vintage.mult}
  × Delivery baseAdjust: ×${delivery.baseAdjust}
  = ${Math.round(totalBaseHours * delivery.baseAdjust).toLocaleString()} effective hours
Rate: $${rate}/hr

Multipliers:
  Data readiness:  ×${dataMult.toFixed(2)}
  AI maturity:     ×${matMult.toFixed(2)}  (applied to foundations only)
  Regulatory:      ×${regMult.toFixed(2)}  (applied to foundations only)

Workflow cost   = effective hours × rate × dataMult = $${Math.round(workflowCost).toLocaleString()}
Foundations     = workflowCost × ${foundationPreset.ratio} [${foundationPreset.name}] × ${foundationScale.toFixed(2)} [N-scale] × regMult × matMult = $${Math.round(foundations).toLocaleString()}
Tightening adj  = ×${tightAdjust.toFixed(2)}
+ Contingency   = ×1.10 (10%)

BUILD TOTAL (P50) = $${Math.round(total).toLocaleString()}
Range ±${(range*100).toFixed(0)}%  →  P10: $${Math.round(p10).toLocaleString()}, P90: $${Math.round(p90).toLocaleString()}
Grade: ${grade}`;

  const whyParts = [`${N} workflow${N>1?'s':''}`, vintage.name.toLowerCase()];
  if (dataMult > 1.05) whyParts.push('messy data');
  if (dataMult < 0.95) whyParts.push('clean data');
  if (regMult > 1.10) whyParts.push('heavy regulatory load');
  if (matMult > 1.10) whyParts.push('early AI maturity');
  if (matMult < 1.0) whyParts.push('mature AI org');
  if (foundationPreset.id === 'greenfield') whyParts.push('greenfield foundations');
  if (foundationPreset.id === 'mature') whyParts.push('mature infra');
  whyParts.push(`${delivery.name.toLowerCase()} at $${rate}/hr`);

  // Build benchmark from per-workflow public data
  let benchmark = null;
  if (benchmarkMed > 0) {
    benchmark = { low: benchmarkLow, median: benchmarkMed, high: benchmarkHigh };
  }

  return {
    empty: false, p10, p50, p90, grade,
    workflowBreakdown: breakdown, pillars, math: mathStr,
    why: whyParts.join(' · '), delivery, rate, vintage, foundationPreset,
    multipliers: { dataMult, matMult, regMult, tightAdjust },
    N, range, benchmark
  };
}

function computeOpEx(buildEst) {
  if (buildEst.empty) return { empty: true, inference: 0, cloud: 0, license: 0, support: 0, annualTotal: 0, math: '' };

  const cloud = CLOUD_OPTIONS.find(c => c.id === state.cloud) || CLOUD_OPTIONS[0];
  const inference = INFERENCE_OPTIONS.find(i => i.id === state.inference) || INFERENCE_OPTIONS[0];
  const volume = VOLUME_OPTIONS.find(v => v.id === state.volume) || VOLUME_OPTIONS[1];
  const license = LICENSE_TIERS.find(l => l.id === state.license) || LICENSE_TIERS[1];

  let inferenceAnnual = 0;
  let inferenceDetail = [];
  for (const w of buildEst.workflowBreakdown) {
    const tw = TOKEN_WEIGHT_MAP[w.tokenWeight || 'med'];
    const monthlyCalls = volume.monthly;
    const annualCost = monthlyCalls * 12 * tw.tokensPerCall * (tw.costPer1K / 1000) * inference.factor;
    inferenceAnnual += annualCost;
    inferenceDetail.push({ name: w.name, cost: annualCost, tokenWeight: w.tokenWeight });
  }

  let cloudAnnual;
  if (state.cloudSpendOverride !== null && state.cloudSpendOverride > 0) {
    cloudAnnual = state.cloudSpendOverride * 12;
  } else {
    cloudAnnual = 3000 * buildEst.N * 12 * cloud.factor; // dropped from 4000 to 3000
  }

  const licenseAnnual = license.annual;
  const supportAnnual = buildEst.p50 * (state.supportPct / 100);
  const annualTotal = inferenceAnnual + cloudAnnual + licenseAnnual + supportAnnual;

  const math =
`ANNUAL OPEX (recurring)
Inference / LLM tokens:
${inferenceDetail.map(d => `  ${d.name} [${d.tokenWeight}]: $${Math.round(d.cost).toLocaleString()}/yr`).join('\n')}
  Inference subtotal: $${Math.round(inferenceAnnual).toLocaleString()}/yr
  (volume: ${volume.name} ${volume.desc} × ${inference.name})

Cloud infra: $${Math.round(cloudAnnual).toLocaleString()}/yr
  (${cloud.name}, factor ×${cloud.factor}, $${Math.round(cloudAnnual/12).toLocaleString()}/mo)

Licenses & tooling: $${licenseAnnual.toLocaleString()}/yr  (${license.name} tier)

Support / ongoing (${state.supportPct}% of build):
  $${Math.round(supportAnnual).toLocaleString()}/yr

ANNUAL OPEX TOTAL: $${Math.round(annualTotal).toLocaleString()}/yr`;

  return { empty: false, inference: inferenceAnnual, cloud: cloudAnnual, license: licenseAnnual, support: supportAnnual, annualTotal, math };
}

function compute3YrTCO(buildEst, opex) {
  if (buildEst.empty) return 0;
  const yr1Opex = opex.annualTotal * 0.5;
  const yr23Opex = opex.annualTotal * 2;
  return buildEst.p50 + yr1Opex + yr23Opex;
}

function computeWaves(est) {
  if (est.empty) return null;
  const items = est.workflowBreakdown.slice().sort((a, b) => {
    const valScore = v => v === 'high' ? 3 : v === 'med' ? 2 : 1;
    return valScore(b.value) - valScore(a.value);
  });
  const w1 = items.slice(0, Math.min(2, items.length));
  const w2 = items.slice(2, Math.min(5, items.length));
  const w3 = items.slice(5);
  const sumCost = arr => arr.reduce((a, b) => a + b.cost, 0);
  return {
    wave1: { items: w1, duration: '3–6 mo', cost: sumCost(w1) + est.pillars.foundations * 0.5 },
    wave2: { items: w2, duration: '6–12 mo', cost: sumCost(w2) + est.pillars.foundations * 0.3 },
    wave3: { items: w3, duration: '12–24 mo', cost: sumCost(w3) + est.pillars.foundations * 0.2 }
  };
}

function pricingForGrade(grade) {
  if (grade === 'B') return [
    { model: 'Fixed price per stage', fit: 'recommended', note: '15% contingency built in' },
    { model: 'Hybrid (fixed + outcome)', fit: 'recommended', note: 'Default for transformation' },
    { model: 'T&M', fit: 'acceptable', note: 'Lower margin but no risk' }
  ];
  if (grade === 'C') return [
    { model: 'T&M with cap', fit: 'recommended', note: 'Discovery stage' },
    { model: 'Hybrid (fixed + outcome)', fit: 'acceptable', note: 'Add 20–25% contingency' },
    { model: 'Fixed price', fit: 'caution', note: 'Risk to consultant' }
  ];
  return [
    { model: 'T&M (discovery only)', fit: 'recommended', note: 'Sell discovery first' },
    { model: 'Fixed price', fit: 'not', note: 'You will lose money' },
    { model: 'Outcome-based', fit: 'not', note: 'No measurable baseline yet' }
  ];
}

function benchmarkVerdict(est) {
  if (!est.benchmark) return null;
  const { low, median, high } = est.benchmark;
  const v = est.p50;
  if (v < low * 0.8) return { kind: 'low', msg: `Your estimate is below the public-data range (${fmt(low)}–${fmt(high)}). May be under-scoped — consider whether you've missed eval, integration, or change management.` };
  if (v < median) return { kind: 'mid', msg: `Your estimate (${fmt(v)}) sits in the lower half of public-data range (median ${fmt(median)}). Reasonable for a modern team with good infra.` };
  if (v < high) return { kind: 'mid', msg: `Your estimate (${fmt(v)}) is in the upper half of public-data range (median ${fmt(median)}, high ${fmt(high)}). Defensible if regulatory/data complexity is real.` };
  if (v < high * 1.3) return { kind: 'high', msg: `Your estimate (${fmt(v)}) is above the public-data high (${fmt(high)}). Likely consultancy-priced or covers extensive foundation buildout. Sanity-check with a smaller pilot first.` };
  return { kind: 'too_high', msg: `Your estimate is ${(v/median).toFixed(1)}× the public median (${fmt(median)}). Strongly consider: simpler vintage, mature infra preset, fewer workflows, or buy-vs-build.` };
}

function fmt(n) {
  if (n >= 1000000) return '$' + (n/1000000).toFixed(2) + 'M';
  if (n >= 1000) return '$' + Math.round(n/1000).toLocaleString() + 'K';
  return '$' + Math.round(n).toLocaleString();
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function selectedWorkflowCount() { let n = 0; for (const id in state.workflows) if (state.workflows[id] && state.workflows[id].selected) n++; return n; }
function tightenAnswered() { let n = 0; for (const k in state.tighten) if (state.tighten[k]) n++; return n; }

function renderBenchmarkBox(est) {

  const { low, median, high } = est.benchmark;
  const verdict = benchmarkVerdict(est);

  const plotMin = low * 0.6;
  const plotMax = high * 1.5;
  const pct = (v) => Math.max(0, Math.min(100, ((v - plotMin) / (plotMax - plotMin)) * 100));

  return `
    <div class="benchmark-box">
      <div class="benchmark-header">
        <span>📊 Public-data sanity check</span>
      </div>
      <div class="benchmark-bar-container">
        <div class="benchmark-bar"></div>
        <div class="benchmark-tick" style="left: ${pct(low)}%"></div>
        <div class="benchmark-label top" style="left: ${pct(low)}%; transform: translateX(-50%)">Low</div>
        <div class="benchmark-label bottom" style="left: ${pct(low)}%; transform: translateX(-50%)">${fmt(low)}</div>
        <div class="benchmark-tick" style="left: ${pct(median)}%"></div>
        <div class="benchmark-label top" style="left: ${pct(median)}%; transform: translateX(-50%)">Median</div>
        <div class="benchmark-label bottom" style="left: ${pct(median)}%; transform: translateX(-50%)">${fmt(median)}</div>
        <div class="benchmark-tick" style="left: ${pct(high)}%"></div>
        <div class="benchmark-label top" style="left: ${pct(high)}%; transform: translateX(-50%)">High</div>
        <div class="benchmark-label bottom" style="left: ${pct(high)}%; transform: translateX(-50%)">${fmt(high)}</div>
        <div class="benchmark-tick estimate" style="left: ${pct(est.p50)}%"></div>
        <div class="benchmark-label top" style="left: ${pct(est.p50)}%; transform: translateX(-50%); color: var(--accent-2); font-weight: 600;">You</div>
      </div>
      <div class="benchmark-verdict verdict-${verdict.kind}">${escapeHtml(verdict.msg)}</div>
      <details>
        <summary>How the benchmarks are built</summary>
        <div class="helper-text" style="padding:8px">Sums public-data ranges for each selected workflow. Sources: documented healthcare AI deployments (Premera prior auth, ambient scribe rollouts, Olive AI public filings), CB Insights deal data, vendor case studies. Low = lean modern team; Median = typical mid-sized implementation; High = full enterprise rollout with consulting overhead. These are <em>build cost</em> benchmarks — comparable to your P50 build number.</div>
      </details>
    </div>
  `;
}

function renderResultCard() {
  const est = computeBuildEstimate();
  if (est.empty) return `<div class="card"><h2 class="card-title">Select workflows first</h2><p class="card-help">Go back to Card 1.</p></div>`;

  const opex = computeOpEx(est);
  const tco3 = compute3YrTCO(est, opex);
  const waves = computeWaves(est);
  const pricing = pricingForGrade(est.grade);
  const gradeClass = 'grade-' + est.grade.charAt(0);
  const benchmarkBox = renderBenchmarkBox(est);

  let wavesHtml = '';
  if (waves) {
    const waveDefs = [
      { key: 'wave1', name: 'Wave 1 — Quick wins', data: waves.wave1, kill: 'If pilots miss KPI threshold, stop & re-scope domains.' },
      { key: 'wave2', name: 'Wave 2 — Strategic builds', data: waves.wave2, kill: "If MLOps platform isn't stable from Wave 1, defer." },
      { key: 'wave3', name: 'Wave 3 — Scale & optimize', data: waves.wave3, kill: 'If foundations exceed 120% of plan, consolidate.' }
    ].filter(w => w.data.items.length > 0);
    let waveItems = '';
    for (const w of waveDefs) {
      waveItems += `<div class="wave-item">
        <div class="wave-header"><span class="wave-title">${escapeHtml(w.name)} · ${escapeHtml(w.data.duration)}</span><span class="wave-cost">${fmt(w.data.cost)}</span></div>
        <div class="wave-items">${w.data.items.map(i => escapeHtml(i.name)).join(', ')}</div>
        <div class="wave-kill"><strong>Kill criteria:</strong> ${escapeHtml(w.kill)}</div>
      </div>`;
    }
    wavesHtml = `<h3>Sequenced wave plan (build cost)</h3><div class="wave-list">${waveItems}</div>`;
  }

  let pricingHtml = '';
  for (const p of pricing) {
    const fitClass = `price-fit-${p.fit === 'not' ? 'not' : p.fit}`;
    const fitLabel = p.fit === 'not' ? 'NOT ADVISED' : p.fit.toUpperCase();
    pricingHtml += `<div class="wave-item">
      <div class="wave-header"><span class="wave-title">${escapeHtml(p.model)}</span><span class="${fitClass}">${fitLabel}</span></div>
      <div class="price-note">${escapeHtml(p.note)}</div>
    </div>`;
  }

  const ta = tightenAnswered();
  const tightenHeader = ta === 0 ? 'Want tighter precision? Answer 4 quick questions →' : (ta < 4 ? `Tightening… ${ta} of 4 answered` : `✓ Tightened — grade ${est.grade}`);
  const tightenSub = ta < 4 ? 'Each question shrinks the range and tightens the grade.' : 'Maximum tightening reached for quick mode.';
  let tightenHtml = '';
  for (const q of TIGHTEN_QS) {
    let opts = '';
    for (const o of q.options) {
      const sel = state.tighten[q.key] === o.v;
      opts += `<div class="tighten-pill${sel ? ' selected' : ''}" data-action="toggle-tighten" data-key="${q.key}" data-value="${o.v}">${escapeHtml(o.l)}</div>`;
    }
    tightenHtml += `<div class="tighten-q"><div class="tighten-q-label">${escapeHtml(q.label)}</div><div class="tighten-q-options">${opts}</div></div>`;
  }

  const opexBreakdown = `
    <div class="opex-breakdown">
      <div class="opex-row"><span class="label">Inference / LLM tokens</span><span class="val">${fmt(opex.inference)}/yr</span></div>
      <div class="opex-row"><span class="label">Cloud infrastructure</span><span class="val">${fmt(opex.cloud)}/yr</span></div>
      <div class="opex-row"><span class="label">Licenses & tooling</span><span class="val">${fmt(opex.license)}/yr</span></div>
      <div class="opex-row"><span class="label">Ongoing support (${state.supportPct}% of build)</span><span class="val">${fmt(opex.support)}/yr</span></div>
      <div class="opex-row" style="font-weight:600;color:var(--text);border-top:2px solid var(--accent);padding-top:8px;margin-top:4px"><span>Annual OpEx total</span><span>${fmt(opex.annualTotal)}/yr</span></div>
    </div>
  `;

  return `
    <div class="card">
      <div class="tco-grid">
        <div class="tco-tile">
          <div class="tco-label">Build (one-time)</div>
          <div class="tco-value build">${fmt(est.p50)}</div>
          <div class="tco-sub">Range: ${fmt(est.p10)} — ${fmt(est.p90)} <span class="grade-badge ${gradeClass}">${est.grade}</span></div>
        </div>
        <div class="tco-tile">
          <div class="tco-label">Annual OpEx</div>
          <div class="tco-value opex">${fmt(opex.annualTotal)}</div>
          <div class="tco-sub">/year (steady state)</div>
        </div>
        <div class="tco-tile highlight">
          <div class="tco-label">3-Year TCO</div>
          <div class="tco-value total">${fmt(tco3)}</div>
          <div class="tco-sub">Build + 2.5 yrs OpEx</div>
        </div>
      </div>

      ${benchmarkBox}

      <div class="result-why"><strong>Why this number:</strong> ${escapeHtml(est.why)}</div>

      <h3>Annual OpEx breakdown</h3>
      ${opexBreakdown}

      <details>
        <summary>Show the math (build + OpEx)</summary>
        <div class="math">${escapeHtml(est.math)}\n\n${escapeHtml(opex.math)}\n\n3-YR TCO = ${fmt(est.p50)} build + ${fmt(opex.annualTotal * 0.5)} (yr1 @ 50% ramp) + ${fmt(opex.annualTotal * 2)} (yr2-3 full) = ${fmt(tco3)}</div>
      </details>

      ${wavesHtml}

      <h3>Pricing options at grade ${est.grade}</h3>
      <div>${pricingHtml}</div>

      <div class="disclosure">
        <h4>${tightenHeader}</h4>
        <p>${tightenSub}</p>
      </div>
      ${tightenHtml}
    </div>
  `;
}

function renderNav() {
  const totalSteps = 5;
  if (state.step === totalSteps - 1) {
    return `<div class="nav">
      <button class="btn btn-secondary" data-action="back">← Adjust inputs</button>
      <button class="btn btn-secondary" data-action="print">Print / PDF</button>
    </div>`;
  }
  const canAdvance = state.step !== 0 || selectedWorkflowCount() > 0;
  const nextLabel = state.step === totalSteps - 2 ? 'See estimate →' : 'Next →';
  return `<div class="nav">
    <button class="btn btn-secondary" data-action="back" ${state.step === 0 ? 'disabled' : ''}>← Back</button>
    <button class="btn" data-action="next" ${!canAdvance ? 'disabled' : ''}>${nextLabel}</button>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  let body = '';
  if (state.step === 0) body = renderWorkflowCard();
  else if (state.step === 1) body = renderSlidersCard();
  else if (state.step === 2) body = renderDeliveryCard();
  else if (state.step === 3) body = renderTcoCard();
  else if (state.step === 4) body = renderResultCard();
  app.innerHTML = renderHeader() + body + renderNav();
}

// ============ EVENTS ============

document.addEventListener('click', e => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.getAttribute('data-action');

  if (action === 'next') setState({ step: Math.min(4, state.step + 1) });
  else if (action === 'back') setState({ step: Math.max(0, state.step - 1) });
  else if (action === 'print') window.print();
  else if (action === 'toggle-workflow') {
    const id = target.getAttribute('data-id');
    const industry = target.getAttribute('data-industry');
    const current = state.workflows[id];
    if (current && current.selected) {
      const next = Object.assign({}, state.workflows); delete next[id]; setState({ workflows: next });
    } else {
      let wf = null;
      for (const ind in WORKFLOWS) { const found = WORKFLOWS[ind].find(w => w.id === id); if (found) { wf = found; break; } }
      if (wf) {
        const next = Object.assign({}, state.workflows);
        next[id] = Object.assign({ selected: true, industry }, wf);
        setState({ workflows: next });
      }
    }
  }
  else if (action === 'set-slider') updatePath('sliders.' + target.getAttribute('data-key'), parseInt(target.getAttribute('data-value')));
  else if (action === 'set-foundation') setState({ foundation: target.getAttribute('data-id') });
  else if (action === 'set-vintage') setState({ vintage: target.getAttribute('data-id') });
  else if (action === 'select-delivery') setState({ delivery: target.getAttribute('data-id'), rateOverride: null });
  else if (action === 'reset-rate') setState({ rateOverride: null });
  else if (action === 'toggle-tighten') {
    const key = target.getAttribute('data-key'); const value = target.getAttribute('data-value');
    const next = Object.assign({}, state.tighten);
    if (next[key] === value) delete next[key]; else next[key] = value;
    setState({ tighten: next });
  }
  else if (action === 'set-cloud') setState({ cloud: target.getAttribute('data-id') });
  else if (action === 'set-inference') setState({ inference: target.getAttribute('data-id') });
  else if (action === 'set-volume') setState({ volume: target.getAttribute('data-id') });
  else if (action === 'set-license') setState({ license: target.getAttribute('data-id') });
  else if (action === 'reset-cloud-override') setState({ cloudSpendOverride: null });
});

document.addEventListener('change', e => {
  const action = e.target.getAttribute && e.target.getAttribute('data-action');
  if (action === 'set-rate') { const v = parseFloat(e.target.value); setState({ rateOverride: isNaN(v) ? null : v }); }
  else if (action === 'set-cloud-override') { const v = parseFloat(e.target.value); setState({ cloudSpendOverride: isNaN(v) || v === 0 ? null : v }); }
  else if (action === 'set-support') { const v = parseFloat(e.target.value); setState({ supportPct: isNaN(v) ? 18 : Math.max(0, Math.min(50, v)) }); }
});

render();
</script>
</body>
</html>
