<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Health Analytics — Vandana Karthikeya</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💓</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="health_data.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --bg2: #0f0f1a;
      --bg3: #14141f;
      --card: rgba(255,255,255,0.04);
      --card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.09);
      --border2: rgba(255,255,255,0.14);
      --accent: #c45d3e;
      --accent-light: #e8734f;
      --teal: #1a6b5a;
      --teal-light: #238f79;
      --teal-bright: #34d399;
      --ink: #f0ede8;
      --ink2: rgba(240,237,232,0.7);
      --ink3: rgba(240,237,232,0.4);
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #60a5fa;
      --purple: #a78bfa;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .serif { font-family: 'DM Serif Display', serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .back-btn {
      display: flex; align-items: center; gap: 0.4rem;
      color: var(--ink3); text-decoration: none;
      font-size: 0.82rem; font-weight: 500;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--accent); }
    .header-title { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--ink); }
    .header-sub { font-size: 0.75rem; color: var(--ink3); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }
    .last-updated { font-size: 0.72rem; color: var(--ink3); font-family: 'JetBrains Mono', monospace; }
    .refresh-badge {
      font-size: 0.7rem; padding: 0.25rem 0.6rem;
      background: rgba(196,93,62,0.15); border: 1px solid rgba(196,93,62,0.3);
      color: var(--accent); border-radius: 20px; cursor: help;
    }

    /* ── Tab Bar ── */
    .tab-bar {
      display: flex; gap: 0; overflow-x: auto;
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.85rem 1.1rem; cursor: pointer;
      font-size: 0.82rem; font-weight: 500;
      color: var(--ink3); background: none; border: none;
      border-bottom: 2px solid transparent;
      white-space: nowrap; transition: all 0.2s; position: relative;
    }
    .tab-btn:hover { color: var(--ink2); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-icon { font-size: 1rem; }

    /* ── Layout ── */
    .main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .col-span-2 { grid-column: span 2; }
    .col-span-3 { grid-column: span 3; }
    .col-span-4 { grid-column: span 4; }
    @media (max-width: 900px) {
      .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .col-span-2, .col-span-3, .col-span-4 { grid-column: span 1; }
    }
    @media (max-width: 560px) {
      .grid-3, .grid-4, .grid-2 { grid-template-columns: 1fr; }
      .main { padding: 1rem; }
    }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border2); }
    .card-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 1rem; gap: 0.5rem;
    }
    .card-title { font-size: 0.8rem; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.05em; }
    .card-subtitle { font-size: 0.72rem; color: var(--ink3); margin-top: 0.2rem; }

    /* ── Source Badges ── */
    .source-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.67rem; font-weight: 600; padding: 0.18rem 0.55rem;
      border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .badge-oura { background: rgba(26,107,90,0.2); border: 1px solid rgba(52,211,153,0.3); color: #34d399; }
    .badge-apple { background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.3); color: var(--blue); }
    .badge-both { background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.3); color: var(--purple); }

    /* ── KPI Cards ── */
    .kpi-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem; font-weight: 500; line-height: 1;
      margin: 0.5rem 0 0.2rem;
    }
    .kpi-unit { font-size: 0.78rem; color: var(--ink3); }
    .kpi-trend { font-size: 0.72rem; margin-top: 0.4rem; }
    .trend-up { color: var(--green); }
    .trend-down { color: var(--red); }
    .trend-flat { color: var(--ink3); }

    /* ── Score Rings ── */
    .score-rings { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; padding: 1rem 0; }
    .score-ring-wrap { text-align: center; }
    .score-ring-label { font-size: 0.75rem; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.5rem; }
    .score-ring-value { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--ink2); }

    /* ── Stats Strip ── */
    .stats-strip {
      display: flex; gap: 1rem; flex-wrap: wrap;
      padding: 0.75rem 1.25rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 1.25rem;
    }
    .stat-item { display: flex; flex-direction: column; gap: 0.15rem; }
    .stat-label { font-size: 0.67rem; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--ink); }
    .stat-divider { width: 1px; background: var(--border); align-self: stretch; }

    /* ── Workout Table ── */
    .workout-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .workout-table th { text-align: left; padding: 0.5rem 0.75rem; color: var(--ink3); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
    .workout-table td { padding: 0.55rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .workout-table tr:last-child td { border-bottom: none; }
    .workout-table tr:hover td { background: var(--card-hover); }
    .intensity-badge {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 20px;
      font-size: 0.65rem; font-weight: 600; text-transform: capitalize;
    }
    .intensity-high { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .intensity-moderate { background: rgba(245,158,11,0.2); color: #fcd34d; }
    .intensity-low { background: rgba(16,185,129,0.2); color: #6ee7b7; }

    /* ── Symptom Tags ── */
    .symptom-tag {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.25rem 0.65rem; border-radius: 20px; font-size: 0.72rem; font-weight: 500;
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5;
      margin: 0.2rem;
    }

    /* ── Resilience Levels ── */
    .resilience-pill {
      display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px;
      font-size: 0.7rem; font-weight: 600; text-transform: capitalize;
    }
    .resilience-solid { background: rgba(16,185,129,0.2); color: #6ee7b7; }
    .resilience-adequate { background: rgba(245,158,11,0.2); color: #fcd34d; }
    .resilience-low { background: rgba(239,68,68,0.2); color: #fca5a5; }

    /* ── Section titles ── */
    .section-title { font-family: 'DM Serif Display', serif; font-size: 1.3rem; margin-bottom: 1rem; color: var(--ink); }
    .section-gap { margin-top: 1.5rem; }

    /* ── Insight Callout ── */
    .insight {
      padding: 0.75rem 1rem; border-radius: 10px;
      background: rgba(196,93,62,0.08); border-left: 3px solid var(--accent);
      font-size: 0.78rem; color: var(--ink2); line-height: 1.5; margin-top: 0.75rem;
    }
    .insight strong { color: var(--accent); }

    /* ── Correlation card ── */
    .r2-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; padding: 0.15rem 0.5rem;
      background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.3);
      color: var(--purple); border-radius: 6px;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 3rem; padding: 1.5rem;
      border-top: 1px solid var(--border); text-align: center;
    }
    .footer-text { font-size: 0.75rem; color: var(--ink3); line-height: 1.7; }
    .footer-code { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; background: rgba(255,255,255,0.05); padding: 0.2rem 0.5rem; border-radius: 4px; }

    /* ── Plotly overrides ── */
    .plotly-container { width: 100%; }
    .plotly-container .modebar { display: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ── Helpers ──────────────────────────────────────────────────────────────
    const scoreColor = (s) => s >= 85 ? '#10b981' : s >= 70 ? '#f59e0b' : '#ef4444';
    const scoreColorRgb = (s) => s >= 85 ? 'rgba(16,185,129,0.2)' : s >= 70 ? 'rgba(245,158,11,0.2)' : 'rgba(239,68,68,0.2)';
    const fmtMin = (m) => { if (!m) return '--'; const h = Math.floor(m/60), mn = m%60; return h > 0 ? `${h}h ${mn}m` : `${mn}m`; };
    const fmtDate = (d) => { if (!d) return ''; const dt = new Date(d+'T12:00:00'); return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' }); };
    const fmtDateLong = (d) => { if (!d) return ''; const dt = new Date(d+'T12:00:00'); return dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); };
    const round1 = (v) => v != null ? Math.round(v * 10) / 10 : null;
    const avg = (arr) => arr.length ? arr.reduce((a,b) => a+b, 0)/arr.length : null;
    const rollingAvg = (vals, win=7) => vals.map((_, i) => {
      const slice = vals.slice(Math.max(0, i-win+1), i+1).filter(v => v != null);
      return slice.length ? round1(avg(slice)) : null;
    });

    const plotlyDark = {
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      font: { family: 'Outfit, sans-serif', color: 'rgba(240,237,232,0.7)', size: 11 },
      xaxis: { gridcolor: 'rgba(255,255,255,0.06)', linecolor: 'rgba(255,255,255,0.1)', tickfont: { size: 10 } },
      yaxis: { gridcolor: 'rgba(255,255,255,0.06)', linecolor: 'rgba(255,255,255,0.1)', tickfont: { size: 10 } },
      margin: { t: 10, b: 40, l: 45, r: 10 },
      showlegend: false,
      hovermode: 'x unified',
    };
    const plotlyConfig = { responsive: true, displayModeBar: false, scrollZoom: false };

    // Pearson r
    const pearsonR = (xs, ys) => {
      const pairs = xs.map((x,i) => [x, ys[i]]).filter(([a,b]) => a!=null && b!=null);
      if (pairs.length < 5) return null;
      const n = pairs.length;
      const mx = avg(pairs.map(p=>p[0])), my = avg(pairs.map(p=>p[1]));
      const num = pairs.reduce((s,[x,y]) => s+(x-mx)*(y-my), 0);
      const den = Math.sqrt(pairs.reduce((s,[x])=>s+(x-mx)**2,0)*pairs.reduce((s,[,y])=>s+(y-my)**2,0));
      return den ? round1(num/den) : null;
    };

    // ── Chart Component ───────────────────────────────────────────────────────
    const PlotChart = ({ traces, layout = {}, style = {} }) => {
      const ref = useRef();
      useEffect(() => {
        if (!ref.current) return;
        const merged = { ...plotlyDark, ...layout,
          xaxis: { ...plotlyDark.xaxis, ...(layout.xaxis||{}) },
          yaxis: { ...plotlyDark.yaxis, ...(layout.yaxis||{}) },
        };
        try { Plotly.newPlot(ref.current, traces, merged, plotlyConfig); } catch(e) { console.error('Plotly error:', e); }
        return () => { try { if (ref.current) Plotly.purge(ref.current); } catch(e) {} };
      }, [JSON.stringify(traces), JSON.stringify(layout)]);
      return <div ref={ref} style={{ width:'100%', ...style }} />;
    };

    // ── Source Badge ──────────────────────────────────────────────────────────
    const SourceBadge = ({ source, note }) => {
      const cls = source === 'oura' ? 'badge-oura' : source === 'apple' ? 'badge-apple' : 'badge-both';
      const label = source === 'oura' ? '◉ Oura Ring' : source === 'apple' ? '◉ Apple Health' : '◎ Both Sources';
      return <span className={`source-badge ${cls}`} title={note}>{label}{note ? ' · ' + note : ''}</span>;
    };

    // ── Score Ring (SVG) ──────────────────────────────────────────────────────
    const ScoreRing = ({ score, label, size = 110 }) => {
      const r = 40, cx = size/2, cy = size/2;
      const circ = 2 * Math.PI * r;
      const pct = (score || 0) / 100;
      const color = scoreColor(score || 0);
      return (
        <div className="score-ring-wrap">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={8}/>
            <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={8}
              strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)}
              strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`}
              style={{ transition: 'stroke-dashoffset 1s ease', filter: `drop-shadow(0 0 6px ${color}66)` }}
            />
            <text x={cx} y={cy+2} textAnchor="middle" dominantBaseline="middle"
              style={{ fontFamily: 'JetBrains Mono', fontSize: '1.05rem', fill: color, fontWeight: 500 }}>
              {score || '--'}
            </text>
          </svg>
          <div className="score-ring-label">{label}</div>
        </div>
      );
    };

    // ── KPI Card ──────────────────────────────────────────────────────────────
    const KPICard = ({ label, value, unit, trend, source, sourceNote, accent }) => {
      const color = accent || 'var(--ink)';
      return (
        <div className="card">
          <div className="card-header">
            <span className="card-title">{label}</span>
            {source && <SourceBadge source={source} note={sourceNote} />}
          </div>
          <div className="kpi-value" style={{ color }}>{value ?? '--'}</div>
          {unit && <div className="kpi-unit">{unit}</div>}
          {trend && <div className={`kpi-trend ${trend.dir}`}>{trend.icon} {trend.text}</div>}
        </div>
      );
    };

    // ── Data Filtering ────────────────────────────────────────────────────────
    const useFilteredData = (range) => {
      return useMemo(() => {
        if (!HEALTH_DATA?.timeline) return [];
        const now = HEALTH_DATA.stats.date_range_end;
        if (range === 'all') return HEALTH_DATA.timeline;
        const days = range === '90' ? 90 : range === '30' ? 30 : 7;
        const cutoff = new Date(now);
        cutoff.setDate(cutoff.getDate() - days);
        const cutStr = cutoff.toISOString().slice(0,10);
        return HEALTH_DATA.timeline.filter(e => e.day >= cutStr);
      }, [range]);
    };

    // ── TAB: Overview ─────────────────────────────────────────────────────────
    const TabOverview = ({ data }) => {
      const stats = HEALTH_DATA.stats;
      const latestDay = [...data].reverse().find(e => e.oura_readiness);
      const last30 = data.slice(-30);

      const sparkTrace = (key, nested) => {
        const days = last30.map(e => e.day);
        const vals = last30.map(e => nested ? e[key]?.[nested] : e[key]);
        return [{
          x: days, y: vals, type: 'scatter', mode: 'lines',
          line: { color: 'var(--accent)', width: 1.5 },
          fill: 'tozeroy', fillcolor: 'rgba(196,93,62,0.1)',
        }];
      };

      const miniLayout = { margin: { t:2, b:2, l:2, r:2 }, height: 50,
        xaxis: { visible: false }, yaxis: { visible: false }, showlegend: false,
        paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)' };

      return (
        <div>
          <div className="stats-strip">
            <div className="stat-item"><span className="stat-label">Study Period</span><span className="stat-value">{fmtDateLong(stats.date_range_start)} → {fmtDateLong(stats.date_range_end)}</span></div>
            <div className="stat-divider" />
            <div className="stat-item"><span className="stat-label">Oura Days</span><span className="stat-value">{stats.days_tracked}</span></div>
            <div className="stat-divider" />
            <div className="stat-item"><span className="stat-label">Avg Readiness</span><span className="stat-value" style={{color: scoreColor(stats.avg_readiness_score)}}>{stats.avg_readiness_score}</span></div>
            <div className="stat-divider" />
            <div className="stat-item"><span className="stat-label">Avg Sleep</span><span className="stat-value" style={{color: scoreColor(stats.avg_sleep_score)}}>{stats.avg_sleep_score}</span></div>
            <div className="stat-divider" />
            <div className="stat-item"><span className="stat-label">Avg HRV</span><span className="stat-value">{stats.avg_hrv} ms</span></div>
            <div className="stat-divider" />
            <div className="stat-item"><span className="stat-label">Avg Resting HR</span><span className="stat-value">{stats.avg_resting_hr} bpm</span></div>
          </div>

          {/* Hero Scores */}
          <div className="card" style={{ marginBottom: '1rem' }}>
            <div className="card-header">
              <div><div className="card-title">Latest Scores — {latestDay ? fmtDateLong(latestDay.day) : ''}</div><div className="card-subtitle">Oura Ring composite readiness, sleep quality, and activity scores (0–100)</div></div>
              <SourceBadge source="oura" note="Composite ring-sensor scores" />
            </div>
            <div className="score-rings">
              <ScoreRing score={latestDay?.oura_readiness?.score} label="Readiness" />
              <ScoreRing score={latestDay?.oura_sleep?.score} label="Sleep" />
              <ScoreRing score={latestDay?.oura_activity?.score} label="Activity" />
            </div>
          </div>

          {/* KPI Grid */}
          <div className="grid-3" style={{ marginBottom: '1rem' }}>
            <div className="card">
              <div className="card-header"><span className="card-title">Resting Heart Rate</span><SourceBadge source="oura" note="Overnight avg" /></div>
              <div className="kpi-value" style={{ color: 'var(--accent)' }}>{latestDay?.oura_sleep_model?.avg_hr?.toFixed(1) ?? '--'}</div>
              <div className="kpi-unit">bpm overnight average</div>
              <PlotChart traces={sparkTrace('oura_sleep_model','avg_hr')} layout={miniLayout} style={{height:50,marginTop:8}} />
            </div>
            <div className="card">
              <div className="card-header"><span className="card-title">HRV (SDNN)</span><SourceBadge source="oura" note="Overnight avg" /></div>
              <div className="kpi-value" style={{ color: 'var(--teal-bright)' }}>{latestDay?.oura_sleep_model?.avg_hrv ?? '--'}</div>
              <div className="kpi-unit">ms — higher = better recovered</div>
              <PlotChart traces={[{...sparkTrace('oura_sleep_model','avg_hrv')[0], line:{color:'#34d399',width:1.5}, fillcolor:'rgba(52,211,153,0.1)'}]} layout={miniLayout} style={{height:50,marginTop:8}} />
            </div>
            <div className="card">
              <div className="card-header"><span className="card-title">Steps</span><SourceBadge source="oura" note="Daily total" /></div>
              <div className="kpi-value" style={{ color: 'var(--blue)' }}>{latestDay?.oura_activity?.steps?.toLocaleString() ?? '--'}</div>
              <div className="kpi-unit">steps · avg {stats.avg_steps_oura?.toLocaleString()}</div>
              <PlotChart traces={[{...sparkTrace('oura_activity','steps')[0], line:{color:'#60a5fa',width:1.5}, fillcolor:'rgba(96,165,250,0.1)'}]} layout={miniLayout} style={{height:50,marginTop:8}} />
            </div>
            <div className="card">
              <div className="card-header"><span className="card-title">SpO₂</span><SourceBadge source="oura" note="Overnight avg" /></div>

    // ── TAB: Sleep ────────────────────────────────────────────────────────────

            </div>
            <PlotChart
              traces={[
                { x: days, y: sleepDays.map(e=>(e.oura_sleep_model?.deep_sleep||0)/60), name:'Deep', type:'bar', marker:{color:'#1a6b5a'}, hovertemplate:'%{y:.1f}h<extra>Deep</extra>' },
                { x: days, y: sleepDays.map(e=>(e.oura_sleep_model?.rem_sleep||0)/60), name:'REM', type:'bar', marker:{color:'#c45d3e'}, hovertemplate:'%{y:.1f}h<extra>REM</extra>' },
                { x: days, y: sleepDays.map(e=>(e.oura_sleep_model?.light_sleep||0)/60), name:'Light', type:'bar', marker:{color:'#60a5fa'}, hovertemplate:'%{y:.1f}h<extra>Light</extra>' },
                { x: days, y: sleepDays.map(e=>(e.oura_sleep_model?.awake_time||0)/60), name:'Awake', type:'bar', marker:{color:'rgba(255,255,255,0.15)'}, hovertemplate:'%{y:.1f}h<extra>Awake</extra>' },
              ]}
              layout={{ barmode:'stack', height:220, showlegend:true,
                legend:{orientation:'h',y:-0.3,font:{size:10}},
                yaxis:{title:'Hours', ticksuffix:'h'},
                margin:{t:10,b:60,l:50,r:10} }}

          </div>

          <div className="grid-2" style={{marginBottom:'1rem'}}>
            {/* Sleep score trend */}
            <div className="card">
              <div className="card-header"><div className="card-title">Sleep Score Trend</div><SourceBadge source="oura" /></div>
              <PlotChart
                traces={[
                  { x: sleepDays.map(e=>e.day), y: sleepDays.map(e=>e.oura_sleep?.score), type:'scatter', mode:'lines+markers',

            {/* Sleep contributors radar */}
            <div className="card">
              <div className="card-header">
                <div><div className="card-title">Sleep Contributors</div><div className="card-subtitle">Night of {latestSleep ? fmtDateLong(latestSleep.day) : ''}</div></div>
                <SourceBadge source="oura" />
              </div>
              {radarVals.length > 0 ? (
                <PlotChart
                  traces={[{
                    type:'scatterpolar', r:[...radarVals, radarVals[0]],
                    theta:[...contribLabels, contribLabels[0]],

          <div className="grid-2" style={{marginBottom:'1rem'}}>
            {/* Intranight HR */}

              <div className="card-header">
                <div><div className="card-title">Heart Rate During Sleep</div><div className="card-subtitle">5-min intervals · {latestSleep ? fmtDateLong(latestSleep.day) : ''}</div></div>

              />

              <div className="card-header"><div className="card-title">Exercise & Stand Time</div><SourceBadge source="apple" note="Apple Watch metrics" /></div>

                traces={[
                  { x: actDays.map(e=>e.day), y: actDays.map(e=>e.apple?.exercise_min), name:'Exercise (min)', type:'scatter', mode:'lines', line:{color:'#34d399',width:2}, connectgaps:true },
                  { x: actDays.map(e=>e.day), y: actDays.map(e=>e.apple?.stand_min), name:'Stand (min)', type:'scatter', mode:'lines', line:{color:'rgba(52,211,153,0.4)',width:1.5}, connectgaps:true },
                  { x: [actDays[0]?.day, actDays[actDays.length-1]?.day], y:[30,30], name:'30 min target', type:'scatter', mode:'lines', line:{color:'rgba(245,158,11,0.5)',width:1,dash:'dash'} },

              />

            </div>
          </div>
        </div>
      );

                  { x: data.filter(e=>e.oura_readiness?.temp_deviation!=null).map(e=>e.day),

                  y: data.filter(e=>e.oura_resilience).map(e=>e.oura_resilience.contributors?.stress||0),
                  name:'Stress Load', type:'scatter', mode:'lines', line:{color:'#c45d3e',width:1.5}, connectgaps:true },
              ]}
              layout={{ height:180, showlegend:true, legend:{orientation:'h',y:-0.35,font:{size:10}}, yaxis:{title:'Score (0–100)'}, margin:{t:10,b:60,l:45,r:10} }}
            />
          </div>
        </div>
      );
    };

    // ── TAB: Mental Wellbeing ─────────────────────────────────────────────────
    const TabMental = ({ data }) => {
      // Aggregate daytime stress by day
      const stressByDay = useMemo(() => {
        const map = {};
        (HEALTH_DATA.daytime_stress || []).forEach(r => {
          if (!map[r.day]) map[r.day] = { stress:[], recovery:[] };
          if (r.stress != null) map[r.day].stress.push(r.stress);
          if (r.recovery != null) map[r.day].recovery.push(r.recovery);
        });
        return Object.entries(map).sort(([a],[b])=>a.localeCompare(b)).map(([day,v])=>({
          day, avg_stress: v.stress.length ? round1(avg(v.stress)) : null,
          avg_recovery: v.recovery.length ? round1(avg(v.recovery)) : null,
        }));
      }, []);

      const mindfulDays = data.filter(e => e.apple?.mindful_mins > 0);
      const daylightDays = data.filter(e => e.apple?.daylight_min != null);

      return (
        <div>
          {/* Stress / Recovery balance */}
          <div className="card" style={{marginBottom:'1rem'}}>
            <div className="card-header">
              <div><div className="card-title">Daily Stress & Recovery Balance</div><div className="card-subtitle">High-stress vs high-recovery hours per day</div></div>
              <SourceBadge source="oura" note="Derived from heart rate, HRV, and movement patterns" />
            </div>
            <PlotChart
              traces={[
                { x: data.filter(e=>e.oura_stress).map(e=>e.day), y: data.filter(e=>e.oura_stress).map(e=>e.oura_stress.recovery_high), name:'Recovery (min)', type:'bar', marker:{color:'#34d399'} },
                { x: data.filter(e=>e.oura_stress).map(e=>e.day), y: data.filter(e=>e.oura_stress).map(e=>-(e.oura_stress.stress_high||0)), name:'Stress (min)', type:'bar', marker:{color:'#c45d3e'} },
              ]}
              layout={{ barmode:'relative', height:200, showlegend:true, legend:{orientation:'h',y:-0.3,font:{size:10}},
                yaxis:{title:'Minutes',zeroline:true,zerolinecolor:'rgba(255,255,255,0.2)'}, margin:{t:10,b:60,l:50,r:10} }}
            />
            <div className="insight">Bars above zero = recovery-dominant days (green). Bars below = stress-dominant (red). <strong>More green than red = sustainable lifestyle.</strong></div>
          </div>

          <div className="grid-2" style={{marginBottom:'1rem'}}>
            {/* Daytime stress timeline */}
            <div className="card">
              <div className="card-header"><div className="card-title">Daytime Stress Load (Daily Avg)</div><SourceBadge source="oura" /></div>
              <PlotChart
                traces={[
                  { x: stressByDay.map(e=>e.day), y: stressByDay.map(e=>e.avg_stress), name:'Stress', type:'scatter', mode:'lines', line:{color:'#ef4444',width:1.5}, fill:'tozeroy', fillcolor:'rgba(239,68,68,0.1)', connectgaps:true },
                  { x: stressByDay.map(e=>e.day), y: stressByDay.map(e=>e.avg_recovery), name:'Recovery', type:'scatter', mode:'lines', line:{color:'#34d399',width:1.5}, connectgaps:true },
                ]}
                layout={{ height:180, showlegend:true, legend:{orientation:'h',y:-0.35,font:{size:10}}, margin:{t:10,b:60,l:45,r:10} }}
              />
            </div>

            {/* HRV as ANS proxy */}
            <div className="card">
              <div className="card-header">
                <div><div className="card-title">HRV as Nervous System Indicator</div><div className="card-subtitle">Higher HRV = parasympathetic (rest/digest) dominance</div></div>
                <SourceBadge source="oura" note="Overnight SDNN — autonomic nervous system proxy" />
              </div>
              <PlotChart
                traces={[{
                  x: data.filter(e=>e.oura_sleep_model?.avg_hrv).map(e=>e.day),
                  y: data.filter(e=>e.oura_sleep_model?.avg_hrv).map(e=>e.oura_sleep_model.avg_hrv),
                  type:'scatter', mode:'lines+markers',
                  line:{color:'#a78bfa',width:2}, marker:{size:4,color:'#a78bfa'},
                  fill:'tozeroy', fillcolor:'rgba(167,139,250,0.1)', connectgaps:true,
                  name:'HRV (ms)',
                }]}
                layout={{ height:180, yaxis:{title:'HRV (ms)'}, margin:{t:10,b:40,l:45,r:10} }}
              />
              <div className="insight">Low HRV mornings after high-stress days suggest your nervous system is still in <strong>sympathetic (fight-or-flight) mode</strong>. Mindfulness and early sleep restore it.</div>
            </div>
          </div>

          <div className="grid-2" style={{marginBottom:'1rem'}}>
            {/* Mindfulness */}
            <div className="card">
              <div className="card-header"><div className="card-title">Mindfulness Sessions</div><SourceBadge source="apple" note="Apple Health mindful minutes" /></div>
              {mindfulDays.length > 0 ? (
                <>
                  <PlotChart
                    traces={[{
                      x: mindfulDays.map(e=>e.day), y: mindfulDays.map(e=>e.apple.mindful_mins),
                      type:'bar', marker:{color:'#a78bfa'},
                      hovertemplate:'%{x}: %{y:.0f} min<extra></extra>',
                    }]}
                    layout={{ height:160, yaxis:{title:'Minutes'}, margin:{t:10,b:40,l:45,r:10} }}
                  />
                  <div className="insight">Total mindfulness sessions: <strong>{mindfulDays.length}</strong> · Avg duration: <strong>{round1(avg(mindfulDays.map(e=>e.apple.mindful_mins)))} min</strong></div>
                </>
              ) : <div style={{padding:'1rem',color:'var(--ink3)',fontSize:'0.8rem'}}>No mindfulness sessions recorded in Apple Health during this period. Consider adding Breathe or Headspace sessions.</div>}
            </div>

            {/* Daylight */}
            <div className="card">
              <div className="card-header">
                <div><div className="card-title">Time in Daylight</div><div className="card-subtitle">Circadian rhythm & mood regulation proxy</div></div>
                <SourceBadge source="apple" note="Apple Watch ambient light sensor" />
              </div>
              <PlotChart
                traces={[
                  { x: daylightDays.map(e=>e.day), y: daylightDays.map(e=>e.apple?.daylight_min), type:'bar', marker:{color:'#fbbf24', opacity:0.8}, name:'Daylight (min)' },
                  { x:[daylightDays[0]?.day, daylightDays[daylightDays.length-1]?.day], y:[20,20], type:'scatter', mode:'lines', line:{color:'rgba(251,191,36,0.5)',width:1.5,dash:'dash'}, name:'20 min target', hoverinfo:'skip' },
                ]}
                layout={{ height:160, showlegend:true, legend:{orientation:'h',y:-0.35,font:{size:10}}, yaxis:{title:'Minutes'}, margin:{t:10,b:60,l:45,r:10} }}
              />
              <div className="insight"><strong>20+ min of morning sunlight</strong> suppresses melatonin, anchors circadian rhythm, and elevates serotonin — directly linked to mood, focus, and sleep quality.</div>
            </div>
          </div>

          {/* Resilience contributors */}
          <div className="card" style={{marginBottom:'1rem'}}>
            <div className="card-header"><div className="card-title">Resilience Contributors — Sleep vs Daytime Recovery</div><SourceBadge source="oura" note="Ability to buffer stress" /></div>
            <PlotChart
              traces={[
                { x: data.filter(e=>e.oura_resilience).map(e=>e.day),
                  y: data.filter(e=>e.oura_resilience).map(e=>e.oura_resilience.contributors?.sleep_recovery||0),
                  name:'Sleep Recovery', type:'scatter', mode:'lines', line:{color:'#60a5fa',width:2}, fill:'tozeroy', fillcolor:'rgba(96,165,250,0.1)', connectgaps:true },
                { x: data.filter(e=>e.oura_resilience).map(e=>e.day),
                  y: data.filter(e=>e.oura_resilience).map(e=>e.oura_resilience.contributors?.daytime_recovery||0),
                  name:'Daytime Recovery', type:'scatter', mode:'lines', line:{color:'#34d399',width:2}, fill:'tozeroy', fillcolor:'rgba(52,211,153,0.07)', connectgaps:true },
              ]}
              layout={{ height:180, showlegend:true, legend:{orientation:'h',y:-0.35,font:{size:10}}, yaxis:{title:'Score (0–100)'}, margin:{t:10,b:60,l:45,r:10} }}
            />
          </div>

          {/* Symptom log */}
          {HEALTH_DATA.rest_mode?.length > 0 && (
            <div className="card">
              <div className="card-header"><div className="card-title">Wellness Events — Rest Mode Log</div><SourceBadge source="oura" note="Self-logged rest mode episodes" /></div>
              {HEALTH_DATA.rest_mode.map((ep, i) => (
                <div key={i} style={{padding:'0.75rem 0', borderBottom:'1px solid var(--border)'}}>
                  <div style={{fontSize:'0.8rem',color:'var(--ink3)',marginBottom:'0.4rem'}}>{fmtDateLong(ep.day)}</div>
                  <div>{ep.tags.map(tag => <span key={tag} className="symptom-tag">⚑ {tag}</span>)}</div>
                </div>
              ))}
              <div style={{fontSize:'0.72rem',color:'var(--ink3)',marginTop:'0.75rem'}}>Tracked via Oura rest mode. Monitor correlations with HRV drops and elevated skin temperature on these dates.</div>
            </div>
          )}
        </div>
      );
    };

    // ── TAB: Correlations ─────────────────────────────────────────────────────
    const TabCorrelations = ({ data }) => {
      const oura = data.filter(e => e.oura_readiness && e.oura_sleep_model);

      // Build lag-1 pairs
      const lag1 = (keys1, keys2) => {
        const pairs = [];
        for (let i = 0; i < oura.length - 1; i++) {
          const x = keys1.reduce((obj,k) => obj?.[k], oura[i]);
          const y = keys2.reduce((obj,k) => obj?.[k], oura[i+1]);
          if (x != null && y != null) pairs.push({ x, y, day: oura[i].day });
        }
        return pairs;
      };
      const same = (keys1, keys2) => {
        return oura.map(e => ({
          x: keys1.reduce((obj,k) => obj?.[k], e),
          y: keys2.reduce((obj,k) => obj?.[k], e),
          day: e.day,
          r: e.oura_readiness?.score,
        })).filter(p => p.x != null && p.y != null);
      };

      const CorrelCard = ({ title, pairs, xLabel, yLabel, note }) => {
        const xs = pairs.map(p=>p.x), ys = pairs.map(p=>p.y);
        const r = pearsonR(xs, ys);
        const r2 = r != null ? round1(r*r) : null;
        return (
          <div className="card">
            <div className="card-header">
              <div><div className="card-title">{title}</div>{r != null && <div className="card-subtitle">r = {r} · r² = {r2}</div>}</div>
              {r != null && <span className="r2-badge">r² = {r2}</span>}
            </div>
            <PlotChart
              traces={[{
                x: xs, y: ys, mode:'markers', type:'scatter',
                text: pairs.map(p=>fmtDate(p.day)),
                marker:{ size:7, opacity:0.75,
                  color: pairs[0]?.r != null ? pairs.map(p=>scoreColor(p.r)) : '#c45d3e' },
                hovertemplate:`${xLabel}: %{x}<br>${yLabel}: %{y}<br>%{text}<extra></extra>`,
              }]}
              layout={{ height:200, xaxis:{title:xLabel}, yaxis:{title:yLabel}, margin:{t:10,b:50,l:50,r:10} }}
            />
            {note && <div className="insight">{note}</div>}
          </div>
        );
      };

      const sleepToReadiness = lag1(['oura_sleep','score'], ['oura_readiness','score']);
      const stressToHRV = lag1(['oura_stress','stress_high'], ['oura_sleep_model','avg_hrv']);
      const hrvToRHR = same(['oura_sleep_model','avg_hrv'], ['oura_sleep_model','avg_hr']);
      const stepsToSleep = lag1(['oura_activity','steps'], ['oura_sleep','score']);

      // Cross-device HR
      const bothHR = data.filter(e=>e.oura_sleep_model?.avg_hr && e.apple?.resting_hr);
      const hrR = pearsonR(bothHR.map(e=>e.oura_sleep_model.avg_hr), bothHR.map(e=>e.apple.resting_hr));

      // Cross-device steps
      const bothSteps = data.filter(e=>e.oura_activity?.steps && e.apple?.steps);

      return (
        <div>
          <div style={{marginBottom:'0.75rem'}}>
            <div className="section-title" style={{fontSize:'1rem',marginBottom:'0.25rem'}}>Oura Internal Correlations</div>
            <div style={{fontSize:'0.75rem',color:'var(--ink3)'}}>Dots colored by readiness score: <span style={{color:'#10b981'}}>■</span> ≥85 · <span style={{color:'#f59e0b'}}>■</span> 70–84 · <span style={{color:'#ef4444'}}>■</span> &lt;70</div>
          </div>
          <div className="grid-2" style={{marginBottom:'1rem'}}>
            <CorrelCard
              title="Sleep Score → Next-Day Readiness"
              pairs={sleepToReadiness}
              xLabel="Sleep Score" yLabel="Readiness (next day)"
              note={`Better sleep tonight = higher readiness tomorrow. ${pearsonR(sleepToReadiness.map(p=>p.x), sleepToReadiness.map(p=>p.y)) > 0.4 ? 'Strong positive correlation.' : 'Moderate relationship — other factors like activity balance also matter.'}`}
            />
            <CorrelCard
              title="HRV vs Resting Heart Rate"
              pairs={hrvToRHR}
              xLabel="HRV (ms)" yLabel="Avg Overnight HR (bpm)"
              note="HRV and resting HR are inversely related. Higher HRV with lower resting HR = best recovered state."
            />
            <CorrelCard
              title="Evening Stress → Next-Morning HRV"
              pairs={stressToHRV}
              xLabel="Stress Load (min)" yLabel="Next-morning HRV (ms)"
              note="High stress load in a day tends to suppress overnight HRV. This is your body's recovery debt signal."
            />
            <CorrelCard
              title="Steps → Next-Day Sleep Score"
              pairs={stepsToSleep}
              xLabel="Steps" yLabel="Sleep Score (next night)"
              note="Moderate activity (8–12K steps) correlates with better sleep. Very high step counts may show diminishing returns."
            />
          </div>

          <div className="section-title" style={{fontSize:'1rem',marginBottom:'0.75rem'}}>Cross-Device Comparison</div>
          <div className="grid-2">
            <div className="card">
              <div className="card-header">
                <div><div className="card-title">Heart Rate — Oura vs Apple Health</div><div className="card-subtitle">r = {hrR ?? 'n/a'}</div></div>
                <SourceBadge source="both" />
              </div>
              <PlotChart
                traces={[
                  { x: bothHR.map(e=>e.day), y: bothHR.map(e=>e.oura_sleep_model.avg_hr), name:'Oura (overnight)', type:'scatter', mode:'lines', line:{color:'#c45d3e',width:2}, connectgaps:true },
                  { x: bothHR.map(e=>e.day), y: bothHR.map(e=>e.apple.resting_hr), name:'Apple Health (daily)', type:'scatter', mode:'lines', line:{color:'#60a5fa',width:1.5,dash:'dot'}, connectgaps:true },
                ]}
                layout={{ height:180, showlegend:true, legend:{orientation:'h',y:-0.35,font:{size:10}}, yaxis:{title:'bpm'}, margin:{t:10,b:60,l:45,r:10} }}
              />
              <div className="insight"><strong>Oura Ring</strong> measures during sleep (lower, more stable). <strong>Apple Health</strong> captures daytime resting HR — consistently higher due to upright posture and activity.</div>
            </div>

            <div className="card">
              <div className="card-header">
                <div><div className="card-title">Step Count — Oura vs Apple Health</div></div>
                <SourceBadge source="both" />
              </div>
              <PlotChart
                traces={[{
                  x: bothSteps.map(e=>e.oura_activity.steps),
                  y: bothSteps.map(e=>e.apple.steps),
                  mode:'markers', type:'scatter',
                  text: bothSteps.map(e=>fmtDate(e.day)),
                  marker:{size:6, color:'#a78bfa', opacity:0.7},
                  hovertemplate:'Oura: %{x}<br>Apple: %{y}<br>%{text}<extra></extra>',
                }]}
                layout={{ height:180, xaxis:{title:'Oura steps'}, yaxis:{title:'Apple Health steps'}, margin:{t:10,b:50,l:55,r:10} }}
              />
              <div className="insight">Apple Health typically counts <strong>more steps</strong> (includes phone carry). Oura counts wrist-movement steps from the ring. Points above the diagonal = Apple reported more than Oura.</div>
            </div>
          </div>
        </div>
      );
    };

    // ── Error Boundary ────────────────────────────────────────────────────────
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(e) { return { error: e }; }
      componentDidCatch(e, info) { console.error('Tab render error:', e, info); }
      render() {
        if (this.state.error) return (
          <div style={{padding:'2rem',color:'#ef4444',fontFamily:'JetBrains Mono,monospace',fontSize:'0.8rem',background:'rgba(239,68,68,0.07)',borderRadius:8,border:'1px solid rgba(239,68,68,0.2)'}}>
            <div style={{marginBottom:'0.5rem',fontWeight:600}}>⚠ Render error in this tab</div>
            <div style={{color:'rgba(240,237,232,0.5)'}}>{this.state.error.message}</div>
            <button onClick={()=>this.setState({error:null})} style={{marginTop:'0.75rem',padding:'0.3rem 0.8rem',background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.3)',borderRadius:4,color:'#ef4444',cursor:'pointer',fontSize:'0.75rem'}}>Retry</button>
          </div>
        );
        return this.props.children;
      }
    }

    // ── Tab Content Router (MUST be outside App to avoid remounting) ──────────
    const TabContent = ({ tab, data }) => {
      const inner = (() => {
        switch(tab) {
          case 'overview':     return <TabOverview data={data} />;
          case 'sleep':        return <TabSleep data={data} />;
          case 'activity':     return <TabActivity data={data} />;
          case 'recovery':     return <TabRecovery data={data} />;
          case 'mental':       return <TabMental data={data} />;
          case 'correlations': return <TabCorrelations data={data} />;
          default:             return null;
        }
      })();
      return <ErrorBoundary key={tab}>{inner}</ErrorBoundary>;
    };

    // ── Chatbot ───────────────────────────────────────────────────────────────
    const Chatbot = () => {
      const [open, setOpen]         = useState(false);
      const [msgs, setMsgs]         = useState([]);
      const [input, setInput]       = useState('');
      const [loading, setLoading]   = useState(false);
      const [apiKey, setApiKey]     = useState(() => localStorage.getItem('anthropic_key') || '');
      const [proxyUrl, setProxyUrl] = useState(() => localStorage.getItem('anthropic_proxy') || '');
      const [keyInput, setKeyInput] = useState('');
      const [proxyInput, setProxyInput] = useState('');
      const bottomRef = useRef();
      const setupDone = apiKey && proxyUrl;

      useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:'smooth' }); }, [msgs, loading]);

      const buildSystemPrompt = () => {
        const s = HEALTH_DATA?.stats || {};
        const last = HEALTH_DATA?.timeline?.slice(-7) || [];
        const recentSummary = last.map(e =>
          `${e.day}: readiness=${e.oura_readiness?.score??'–'} sleep=${e.oura_sleep?.score??'–'} hrv=${e.oura_sleep_model?.avg_hrv??'–'}ms steps=${e.oura_activity?.steps??'–'}`
        ).join('\n');
        return `You are a personal health assistant analyzing Vandana's wearable data from Oura Ring and Apple Health.

Key stats (${s.date_range_start} → ${s.date_range_end}):
- Days tracked: ${s.days_tracked} (Oura) · ${s.apple_days_tracked} (Apple Health)
- Avg readiness: ${s.avg_readiness_score} · Avg sleep score: ${s.avg_sleep_score} · Avg activity score: ${s.avg_activity_score}
- Avg HRV: ${s.avg_hrv}ms · Avg resting HR: ${s.avg_resting_hr}bpm · Avg SpO2: ${s.avg_spo2}%
- Latest readiness: ${s.latest_readiness_score} · Latest sleep: ${s.latest_sleep_score} · Latest HRV: ${s.latest_hrv}ms

Recent 7 days:
${recentSummary}

Workouts logged: ${HEALTH_DATA?.workouts?.length ?? 0}
Rest mode episodes: ${HEALTH_DATA?.rest_mode?.length ?? 0}

Respond concisely with actionable insights. Be direct and data-driven. Use the actual numbers above when answering.`;
      };

      const send = async () => {
        if (!input.trim() || loading) return;
        const userMsg = { role: 'user', content: input.trim() };
        const newMsgs = [...msgs, userMsg];
        setMsgs(newMsgs);
        setInput('');
        setLoading(true);
        try {
          const res = await fetch(proxyUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
            },
            body: JSON.stringify({
              model: 'claude-haiku-4-5-20251001',
              max_tokens: 512,
              system: buildSystemPrompt(),
              messages: newMsgs,
            }),
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error?.message || `API error ${res.status}`);
          const reply = json.content?.[0]?.text || '(no response)';
          setMsgs(m => [...m, { role:'assistant', content: reply }]);
        } catch(e) {
          setMsgs(m => [...m, { role:'assistant', content: `⚠ Error: ${e.message}` }]);
        }
        setLoading(false);
      };

      const saveSetup = () => {
        if (!keyInput.trim() || !proxyInput.trim()) return;
        localStorage.setItem('anthropic_key', keyInput.trim());
        localStorage.setItem('anthropic_proxy', proxyInput.trim());
        setApiKey(keyInput.trim());
        setProxyUrl(proxyInput.trim());
        setKeyInput('');
        setProxyInput('');
      };

      const SUGGESTIONS = [
        'How was my recovery this week?',
        'When did I sleep best and why?',
        'What does my HRV trend say about stress?',
        'How do my step counts compare to targets?',
      ];

      return (
        <>
          {/* Floating button */}
          <button onClick={() => setOpen(o => !o)}
            style={{ position:'fixed', bottom:'1.5rem', right:'1.5rem', zIndex:1000,
              width:52, height:52, borderRadius:'50%', border:'none', cursor:'pointer',
              background:'var(--accent)', color:'#fff', fontSize:'1.4rem',
              boxShadow:'0 4px 20px rgba(196,93,62,0.5)', transition:'transform 0.2s',
              display:'flex', alignItems:'center', justifyContent:'center' }}
            title="Ask about your health data">
            {open ? '✕' : '💬'}
          </button>

          {/* Chat panel */}
          {open && (
            <div style={{ position:'fixed', bottom:'5rem', right:'1.5rem', zIndex:999,
              width:'min(380px, calc(100vw - 2rem))', height:'min(520px, 70vh)',
              background:'#13131a', border:'1px solid var(--border)', borderRadius:14,
              display:'flex', flexDirection:'column',
              boxShadow:'0 12px 40px rgba(0,0,0,0.6)' }}>

              {/* Header */}
              <div style={{ padding:'0.85rem 1rem', borderBottom:'1px solid var(--border)',
                display:'flex', alignItems:'center', gap:'0.6rem' }}>
                <span style={{fontSize:'1rem'}}>🧬</span>
                <div>
                  <div style={{fontFamily:'Outfit,sans-serif',fontWeight:600,fontSize:'0.9rem',color:'var(--ink)'}}>Health AI Assistant</div>
                  <div style={{fontSize:'0.68rem',color:'var(--ink3)'}}>Powered by Claude · data stays in your browser</div>
                </div>
              </div>

              {/* API key prompt */}
              {!setupDone ? (
                <div style={{ flex:1, overflowY:'auto', padding:'1.25rem', display:'flex', flexDirection:'column', gap:'0.65rem' }}>
                  <div style={{fontSize:'0.78rem',color:'var(--ink)',fontWeight:600}}>One-time setup (2 steps)</div>

                  <div style={{fontSize:'0.72rem',color:'var(--ink3)',lineHeight:1.5,background:'rgba(255,255,255,0.04)',padding:'0.6rem 0.75rem',borderRadius:6,border:'1px solid var(--border)'}}>
                    <strong style={{color:'var(--ink)'}}>Step 1 — Deploy a free proxy (3 min):</strong><br/>
                    1. Open <a href="https://workers.cloudflare.com" target="_blank" style={{color:'var(--accent)'}}>workers.cloudflare.com</a> → sign up free<br/>
                    2. Click <strong>Create a Worker</strong><br/>
                    3. Replace all code with the contents of <code style={{background:'rgba(255,255,255,0.08)',padding:'0 3px',borderRadius:3}}>cloudflare-worker.js</code> in your repo<br/>
                    4. Click <strong>Save and Deploy</strong> → copy the <code style={{background:'rgba(255,255,255,0.08)',padding:'0 3px',borderRadius:3}}>.workers.dev</code> URL
                  </div>

                  <div style={{fontSize:'0.72rem',color:'var(--ink3)'}}>Cloudflare Worker URL</div>
                  <input
                    type="text" placeholder="https://health-proxy.yourname.workers.dev"
                    value={proxyInput} onChange={e=>setProxyInput(e.target.value)}
                    style={{ width:'100%', padding:'0.55rem 0.7rem', background:'rgba(255,255,255,0.05)',
                      border:'1px solid var(--border)', borderRadius:6, color:'var(--ink)',
                      fontFamily:'JetBrains Mono,monospace', fontSize:'0.72rem', outline:'none', boxSizing:'border-box' }}
                  />

                  <div style={{fontSize:'0.72rem',color:'var(--ink3)'}}>Anthropic API Key — <a href="https://console.anthropic.com/keys" target="_blank" style={{color:'var(--accent)'}}>get one free →</a></div>
                  <input
                    type="password" placeholder="sk-ant-..."
                    value={keyInput} onChange={e=>setKeyInput(e.target.value)}
                    onKeyDown={e=>e.key==='Enter'&&saveSetup()}
                    style={{ width:'100%', padding:'0.55rem 0.7rem', background:'rgba(255,255,255,0.05)',
                      border:'1px solid var(--border)', borderRadius:6, color:'var(--ink)',
                      fontFamily:'JetBrains Mono,monospace', fontSize:'0.72rem', outline:'none', boxSizing:'border-box' }}
                  />

                  <button onClick={saveSetup} disabled={!keyInput.trim()||!proxyInput.trim()}
                    style={{ padding:'0.55rem', background: keyInput.trim()&&proxyInput.trim() ? 'var(--accent)' : 'rgba(255,255,255,0.06)',
                      border:'none', borderRadius:6, color: keyInput.trim()&&proxyInput.trim() ? '#fff' : 'var(--ink3)',
                      cursor: keyInput.trim()&&proxyInput.trim() ? 'pointer' : 'default',
                      fontFamily:'Outfit,sans-serif', fontSize:'0.82rem', fontWeight:500 }}>
                    Save & Start Chatting →
                  </button>
                  <div style={{fontSize:'0.65rem',color:'var(--ink3)',textAlign:'center',lineHeight:1.4}}>Both stored in your browser only. The proxy forwards requests to Anthropic — your health data never leaves your device.</div>
                </div>
              ) : (
                <>
                  {/* Messages */}
                  <div style={{ flex:1, overflowY:'auto', padding:'0.75rem', display:'flex', flexDirection:'column', gap:'0.6rem' }}>
                    {msgs.length === 0 && (
                      <div style={{ padding:'0.5rem 0' }}>
                        <div style={{fontSize:'0.78rem',color:'var(--ink3)',marginBottom:'0.6rem'}}>Ask about your health data:</div>
                        {SUGGESTIONS.map(s => (
                          <button key={s} onClick={() => { setInput(s); }}
                            style={{ display:'block', width:'100%', textAlign:'left', marginBottom:'0.4rem',
                              padding:'0.45rem 0.7rem', background:'rgba(255,255,255,0.04)',
                              border:'1px solid var(--border)', borderRadius:6, color:'var(--ink3)',
                              cursor:'pointer', fontSize:'0.75rem', fontFamily:'Outfit,sans-serif' }}>
                            {s}
                          </button>
                        ))}
                      </div>
                    )}
                    {msgs.map((m, i) => (
                      <div key={i} style={{
                        alignSelf: m.role==='user' ? 'flex-end' : 'flex-start',
                        maxWidth:'88%', padding:'0.55rem 0.8rem',
                        background: m.role==='user' ? 'var(--accent)' : 'rgba(255,255,255,0.06)',
                        borderRadius: m.role==='user' ? '10px 10px 2px 10px' : '10px 10px 10px 2px',
                        fontSize:'0.78rem', lineHeight:1.55, color:'var(--ink)',
                        fontFamily:'Outfit,sans-serif', whiteSpace:'pre-wrap',
                      }}>{m.content}</div>
                    ))}
                    {loading && (
                      <div style={{ alignSelf:'flex-start', padding:'0.5rem 0.8rem',
                        background:'rgba(255,255,255,0.06)', borderRadius:'10px 10px 10px 2px',
                        fontSize:'0.78rem', color:'var(--ink3)' }}>
                        ●●● thinking
                      </div>
                    )}
                    <div ref={bottomRef} />
                  </div>

                  {/* Input */}
                  <div style={{ padding:'0.6rem 0.75rem', borderTop:'1px solid var(--border)',
                    display:'flex', gap:'0.5rem', alignItems:'flex-end' }}>
                    <textarea
                      value={input} onChange={e=>setInput(e.target.value)} placeholder="Ask about your data…"
                      onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }}
                      rows={1} style={{ flex:1, resize:'none', padding:'0.5rem 0.65rem',
                        background:'rgba(255,255,255,0.05)', border:'1px solid var(--border)',
                        borderRadius:6, color:'var(--ink)', fontFamily:'Outfit,sans-serif',
                        fontSize:'0.78rem', outline:'none', lineHeight:1.4, maxHeight:80,
                        overflowY:'auto' }}
                    />
                    <button onClick={send} disabled={loading || !input.trim()}
                      style={{ padding:'0.5rem 0.75rem', background: loading||!input.trim() ? 'rgba(255,255,255,0.05)' : 'var(--accent)',
                        border:'none', borderRadius:6, color: loading||!input.trim() ? 'var(--ink3)' : '#fff',
                        cursor: loading||!input.trim() ? 'default' : 'pointer', fontSize:'0.9rem',
                        transition:'all 0.15s', flexShrink:0 }}>
                      ↑
                    </button>
                  </div>

                  {/* Clear/key row */}
                  <div style={{ padding:'0.3rem 0.75rem 0.5rem', display:'flex', gap:'0.75rem', justifyContent:'flex-end' }}>
                    {msgs.length > 0 && <button onClick={()=>setMsgs([])} style={{fontSize:'0.65rem',color:'var(--ink3)',background:'none',border:'none',cursor:'pointer',padding:0}}>Clear chat</button>}
                    <button onClick={()=>{localStorage.removeItem('anthropic_key');localStorage.removeItem('anthropic_proxy');setApiKey('');setProxyUrl('');setMsgs([]);}} style={{fontSize:'0.65rem',color:'var(--ink3)',background:'none',border:'none',cursor:'pointer',padding:0}}>Change setup</button>
                  </div>
                </>
              )}
            </div>
          )}
        </>
      );
    };

    // ── Main App ──────────────────────────────────────────────────────────────
    const TABS = [
      { id:'overview', label:'Overview', icon:'📊' },
      { id:'sleep', label:'Sleep', icon:'🌙' },
      { id:'activity', label:'Activity', icon:'🏃' },
      { id:'recovery', label:'Recovery', icon:'⚡' },
      { id:'mental', label:'Mental Wellbeing', icon:'🧠' },
      { id:'correlations', label:'Correlations', icon:'🔗' },
    ];

    const RANGES = [
      { value:'all', label:'Full Study' },
      { value:'90', label:'Last 90d' },
      { value:'30', label:'Last 30d' },
      { value:'7', label:'Last 7d' },
    ];

    const App = () => {
      const [tab, setTab] = useState('overview');
      const [range, setRange] = useState('all');
      const data = useFilteredData(range);
      const stats = HEALTH_DATA?.stats || {};

      return (
        <>
          {/* Header */}
          <div className="header">
            <a href="/" className="back-btn">← vandanakarthikeya.github.io</a>
            <div>
              <div className="header-title serif">Personal Health Analytics</div>
              <div className="header-sub">Oura Ring + Apple Health · 89-day study · 495K+ records</div>
            </div>
            <div className="header-right">
              {/* Range picker */}
              <div style={{display:'flex',gap:'0.3rem'}}>
                {RANGES.map(r => (
                  <button key={r.value} onClick={() => setRange(r.value)}
                    style={{ padding:'0.3rem 0.65rem', fontSize:'0.72rem', borderRadius:6, cursor:'pointer', transition:'all 0.15s',
                      background: range===r.value ? 'var(--accent)' : 'rgba(255,255,255,0.05)',
                      border: range===r.value ? '1px solid var(--accent)' : '1px solid var(--border)',
                      color: range===r.value ? '#fff' : 'var(--ink3)', fontFamily:'Outfit,sans-serif' }}>
                    {r.label}
                  </button>
                ))}
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:'0.15rem',textAlign:'right'}}>
                <div className="last-updated">
                  <span style={{color:'#34d399'}}>◉ Oura</span> {stats.oura_updated_at || stats.generated_at}
                </div>
                <div className="last-updated">
                  <span style={{color: stats.apple_updated_at ? '#60a5fa' : 'rgba(240,237,232,0.25)'}}>◉ Apple Health</span>{' '}
                  {stats.apple_updated_at || <span style={{color:'rgba(240,237,232,0.3)'}}>not synced — tap Shortcut</span>}
                </div>
              </div>
            </div>
          </div>

          {/* Tabs */}
          <div className="tab-bar">
            {TABS.map(t => (
              <button key={t.id} className={`tab-btn ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>
                <span className="tab-icon">{t.icon}</span>{t.label}
              </button>
            ))}
          </div>

          {/* Content */}
          <div className="main">
            <TabContent tab={tab} data={data} />
          </div>

          {/* Chatbot */}
          <Chatbot />

          {/* Footer */}
          <div className="footer">
            <div className="footer-text">
              Data last updated <strong>{stats.generated_at}</strong> · {stats.days_tracked} days of Oura Ring data · {stats.apple_days_tracked} days of Apple Health data<br/>
              To refresh: export new data from Oura app and Apple Health, replace source files, run <span className="footer-code">python3 pipeline/run.py</span>, commit <span className="footer-code">health_data.js</span><br/>
              <span style={{color:'var(--ink3)',fontSize:'0.7rem'}}>For continuous sync: Oura API integration (roadmap) · All raw health data stays on your local machine only</span>
            </div>
          </div>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
