<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">Professional anime-style digital twin avatar</title>
  <desc id="desc">A polished illustrated avatar inspired by Vandana's profile photo, with curly hair, glasses, navy outfit, jewelry, and health-energy accents.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#79ffd1" stop-opacity=".38"/>
      <stop offset="58%" stop-color="#76b7ff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#0a0a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7c8a8"/>
      <stop offset="48%" stop-color="#d99a76"/>
      <stop offset="100%" stop-color="#a9664d"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#17110f"/>
      <stop offset="45%" stop-color="#2d211c"/>
      <stop offset="100%" stop-color="#7b4b2c"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#13213c"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" x2="1">
      <stop offset="0%" stop-color="#39d7a4"/>
      <stop offset="100%" stop-color="#76b7ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".36"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="520" height="520" rx="52" fill="none"/>
  <circle cx="260" cy="245" r="210" fill="url(#halo)"/>
  <circle cx="260" cy="250" r="182" fill="none" stroke="#39d7a4" stroke-opacity=".22" stroke-width="3"/>
  <path d="M93 338c48-58 102-86 166-84 72 2 127 39 167 112" fill="none" stroke="#76b7ff" stroke-opacity=".28" stroke-width="14" stroke-linecap="round"/>

  <g filter="url(#softShadow)">
    <path d="M137 500c14-104 62-162 126-162s114 58 128 162z" fill="url(#navy)"/>
    <path d="M204 356l56 73 58-73 39 144H165z" fill="#0a162c" opacity=".82"/>
    <path d="M207 359l53 59 52-59" fill="none" stroke="#24375e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M103 218c-10-99 58-172 157-172 102 0 171 76 158 180-8 70-44 132-159 132-111 0-148-63-156-140z" fill="url(#hair)"/>
    <path d="M92 250c-36 54-17 134 45 163 38 18 76 10 100-15-82-28-127-80-145-148z" fill="#211812"/>
    <path d="M426 250c39 54 18 134-47 164-39 18-78 9-102-16 86-29 132-81 149-148z" fill="#231912"/>

    <path d="M137 210c5-87 52-135 126-135 72 0 120 51 124 137 5 97-45 160-125 160-77 0-130-64-125-162z" fill="url(#skin)"/>
    <path d="M139 210c41-65 103-83 217-41-18-58-61-94-119-96-59-2-102 47-98 137z" fill="url(#hair)"/>

    <path d="M126 217c-17 2-27 16-24 37 3 24 19 37 38 32z" fill="#c98265"/>
    <path d="M394 217c17 2 27 16 24 37-3 24-19 37-38 32z" fill="#c98265"/>

    <path d="M173 225c25-13 51-13 76 0" fill="none" stroke="#2f211a" stroke-width="7" stroke-linecap="round"/>
    <path d="M273 225c25-13 51-13 76 0" fill="none" stroke="#2f211a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="207" cy="246" r="10" fill="#1a1d27"/>
    <circle cx="313" cy="246" r="10" fill="#1a1d27"/>
    <circle cx="211" cy="242" r="3.5" fill="#fff" opacity=".86"/>
    <circle cx="317" cy="242" r="3.5" fill="#fff" opacity=".86"/>

    <path d="M252 244c-5 22-13 42-22 58 14 10 38 10 54 0-10-17-18-36-22-58z" fill="#c58163" opacity=".45"/>
    <path d="M218 322c26 24 61 24 86 0" fill="none" stroke="#884b4d" stroke-width="9" stroke-linecap="round"/>
    <path d="M224 315c24 10 50 10 74 0" fill="none" stroke="#c45d63" stroke-width="5" stroke-linecap="round"/>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M163 223c25-18 62-17 83 3 4 28-11 50-39 52-30 2-50-19-44-55z" stroke="#1c1411" stroke-width="10"/>
      <path d="M278 226c22-20 59-21 82-3 7 35-13 57-44 55-28-2-42-24-38-52z" stroke="#1c1411" stroke-width="10"/>
      <path d="M246 226c10-6 22-6 32 0" stroke="#1c1411" stroke-width="8"/>
      <path d="M167 221l-23-8" stroke="#c99a58" stroke-width="8"/>
      <path d="M358 221l23-8" stroke="#c99a58" stroke-width="8"/>
    </g>
    <path d="M176 224c19-13 46-12 63 2" fill="none" stroke="#8a5b3b" stroke-width="4" opacity=".76"/>
    <path d="M286 226c18-14 45-15 63-2" fill="none" stroke="#8a5b3b" stroke-width="4" opacity=".76"/>

    <g opacity=".98">
      <circle cx="130" cy="303" r="12" fill="#e7d8c8"/>
      <circle cx="390" cy="303" r="12" fill="#e7d8c8"/>
      <circle cx="130" cy="303" r="6" fill="#fff"/>
      <circle cx="390" cy="303" r="6" fill="#fff"/>
      <path d="M225 392c18 16 49 16 68 0" fill="none" stroke="#dbc59b" stroke-width="4"/>
      <path d="M207 385c30 35 75 35 105 0" fill="none" stroke="#e9d8b5" stroke-width="3"/>
      <circle cx="260" cy="408" r="9" fill="#f7f4ea"/>
      <circle cx="260" cy="431" r="8" fill="#f7f4ea"/>
    </g>
  </g>

  <g filter="url(#glow)">
    <path d="M402 370l20 20 42-56" fill="none" stroke="url(#energy)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="88" cy="118" r="10" fill="#39d7a4"/>
    <circle cx="430" cy="132" r="8" fill="#76b7ff"/>
    <circle cx="110" cy="405" r="7" fill="#f2c96d"/>
